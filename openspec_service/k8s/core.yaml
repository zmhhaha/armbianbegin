apiVersion: v1
kind: Namespace
metadata:
  name: openspec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openspec-service-config
  namespace: openspec
data:
  OIDC_ISSUER: "https://auth.panghuer.top"
  OIDC_AUDIENCE: "openspec-api"
  OIDC_JWKS_URL: "https://auth.panghuer.top/.well-known/jwks.json"
  GITEA_URL: "http://gitea.gitops.svc.cluster.local:3000"
  GITEA_OWNER: "openspec"
  WORKSPACE_ROOT: "/data/workspaces"
  BOOTSTRAP_ADMIN_SUBJECTS: "REPLACE_WITH_CASDOOR_ADMIN_SUB"
  GIT_USER: "openspec-service"
  GIT_EMAIL: "openspec-service@panghuer.top"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openspec-workspaces
  namespace: openspec
  labels: {app.kubernetes.io/name: openspec-service}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: openspec-service
  namespace: openspec
spec:
  selector: {app: openspec-service}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openspec-service
  namespace: openspec
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspec-service
  namespace: openspec
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: openspec-service}}
  template:
    metadata: {labels: {app: openspec-service}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      serviceAccountName: openspec-service
      containers:
      - name: api
        image: arm-cluster-master:5000/openspec-service:0.1.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef: {name: openspec-service-config}
        - secretRef: {name: openspec-service-secrets}
        env: [{name: PORT, value: "8080"}]
        ports: [{name: http, containerPort: 8080}]
        volumeMounts: [{name: workspaces, mountPath: /data/workspaces}]
        startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 2}
        readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes: [{name: workspaces, persistentVolumeClaim: {claimName: openspec-workspaces}}]
