apiVersion: v1
kind: Namespace
metadata:
  name: openspec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openspec-service-config
  namespace: openspec
data:
  OIDC_ISSUER: "https://auth.panghuer.top"
  # 有效 audience。两种取值都必须接受 —— 同一个应用签发的 token，其 aud 取决于客户端有没有带 resource：
  #   1) https://openspec.panghuer.top/mcp —— MCP 客户端按规范带 `resource`，Casdoor 4.11.0 照
  #      RFC 8707 把 aud 设成该 URL（Claude Code 实测如此）。**少这一条 → 客户端换到 token 也过不了，
  #      现象是浏览器授权成功、但客户端状态一直 needs-auth。**
  #   2) 315cbdaf565b82103c6f —— 不带 resource 的流程，aud = 该应用的 client_id：
  #      命令行 scripts/get-token.sh、项目申请表单登录（GET /project-requests/login）。
  # 2026-10-02 起 panghu-suite 的 ece3f52410b046fe0952 已移除 —— 意味着「人工取长期 JWT 贴进
  #   工具配置」的旧路线彻底关闭；那类旧 token 会立刻 401，用 get-token.sh 重新取一把即可。
  OIDC_AUDIENCE: "315cbdaf565b82103c6f,https://openspec.panghuer.top/mcp"
  OIDC_JWKS_URL: "https://auth.panghuer.top/.well-known/jwks"
  PUBLIC_BASE_URL: "https://openspec.panghuer.top"
  # 项目申请登录用的 MCP 专用应用（公共客户端，无 secret）。
  # 原来给人取长期 JWT 的 /token 用 panghu-suite + CASDOOR_CLIENT_SECRET，已退役。
  CASDOOR_MCP_CLIENT_ID: "315cbdaf565b82103c6f"
  GITEA_URL: "http://gitea.gitops.svc.cluster.local:3000"
  GITEA_PUBLIC_URL: "https://gitea.panghuer.top"
  GITEA_OWNER: "openspec-service"
  GITEA_REQUEST_OWNER: "openspec-service"
  GITEA_REQUEST_REPOSITORY: "project-requests"
  GITEA_APPROVAL_LABEL: "status:approved"
  GITEA_FAILURE_LABEL: "status:failed"
  GITEA_SCRIPT_PROFILES: "openspec-bootstrap-v1,openspec-validate-v1"
  WORKSPACE_ROOT: "/data/workspaces"
  BOOTSTRAP_ADMIN_SUBJECTS: "27714443"
  GIT_USER: "openspec-service"
  GIT_EMAIL: "openspec-service@panghuer.top"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openspec-workspaces
  namespace: openspec
  labels: {app.kubernetes.io/name: openspec-service}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: openspec-service
  namespace: openspec
spec:
  selector: {app: openspec-service}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openspec-service
  namespace: openspec
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspec-service
  namespace: openspec
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: openspec-service}}
  template:
    metadata: {labels: {app: openspec-service}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      serviceAccountName: openspec-service
      containers:
      - name: api
        image: arm-cluster-master:5000/openspec-service:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef: {name: openspec-service-config}
        - secretRef: {name: openspec-service-secrets}
        env: [{name: PORT, value: "8080"}]
        ports: [{name: http, containerPort: 8080}]
        volumeMounts: [{name: workspaces, mountPath: /data/workspaces}]
        startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 2}
        readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes: [{name: workspaces, persistentVolumeClaim: {claimName: openspec-workspaces}}]
