apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openspec-service-secrets
  namespace: openspec
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: openspec-service-secrets, creationPolicy: Owner}
  data:
  - secretKey: DATABASE_URL
    remoteRef: {key: secret/data/openspec/service, property: database_url}
  - secretKey: GITEA_TOKEN
    remoteRef: {key: secret/data/openspec/service, property: gitea_provision_token}
  - secretKey: GITEA_USERNAME
    remoteRef: {key: secret/data/openspec/service, property: gitea_username}
---
apiVersion: cf.armbianbegin.io/v1
kind: TunnelRoute
metadata:
  name: openspec-service
  namespace: default
spec:
  tunnelRef: main
  hostname: openspec.panghuer.top
  backend: openspec-service.openspec.svc.cluster.local:8080
