# /etc/gitea/app.ini（需手动创建）
APP_NAME = MyGitea
RUN_MODE = prod
[repository]
ROOT = /var/lib/gitea/data/repositories
[database]
DB_TYPE  = postgres
HOST     = postgres.data.svc.cluster.local:5432
NAME     = gitea
USER     = gitea
; PASSWD is injected through GITEA__database__PASSWD.
LOG_SQL  = false
[server]
PROTOCOL     = http
DOMAIN       = gitea.panghuer.top
HTTP_PORT    = 3000
ROOT_URL     = https://gitea.panghuer.top/
DISABLE_SSH  = true
[app]
APP_DATA_PATH = /var/lib/gitea/data
[webhook]
ALLOWED_HOST_LIST = drone.panghuer.top
[oauth2]
ENABLED = true
[service]
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true
