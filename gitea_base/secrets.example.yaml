# Example only. Do not apply this file and do not commit real values.
# The Vault property GITEA_POSTGRES_PASSWORD must match the dedicated
# PostgreSQL user created in data/postgres.
# Create these Secrets from Vault/ESO before applying the workloads.
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-secrets
  namespace: gitops
stringData:
  GITEA__database__PASSWD: "REPLACE_WITH_GITEA_POSTGRES_PASSWORD"
  GITEA__security__SECRET_KEY: "REPLACE_WITH_RANDOM_VALUE"
  GITEA__security__INTERNAL_TOKEN: "REPLACE_WITH_RANDOM_VALUE"
  GITEA__oauth2__JWT_SECRET: "REPLACE_WITH_RANDOM_VALUE"
---
apiVersion: v1
kind: Secret
metadata:
  name: drone-server-secrets
  namespace: gitops
stringData:
  DRONE_GITEA_CLIENT_ID: "REPLACE_WITH_GITEA_OAUTH_CLIENT_ID"
  DRONE_GITEA_CLIENT_SECRET: "REPLACE_WITH_GITEA_OAUTH_CLIENT_SECRET"
  DRONE_RPC_SECRET: "REPLACE_WITH_RANDOM_VALUE"
---
apiVersion: v1
kind: Secret
metadata:
  name: drone-runner-secrets
  namespace: gitops
stringData:
  DRONE_RPC_SECRET: "REPLACE_WITH_THE_SAME_DRONE_RPC_SECRET"
