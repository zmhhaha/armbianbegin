# Optional ingress-nginx exposure. Use this instead of Cloudflare Tunnel routes,
# not together with them. TLS is terminated by the ingress controller in this mode.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops
  namespace: gitops
spec:
  ingressClassName: nginx
  rules:
  - host: gitea.panghuer.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitea
            port:
              number: 3000
  - host: drone.panghuer.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: drone-server
            port:
              number: 8080
