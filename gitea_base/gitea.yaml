# Gitea StatefulSet and internal Service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea
  namespace: gitops
spec:
  serviceName: gitea
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      initContainers:
      - name: init-gitea
        image: arm-cluster-master:5000/gitea_base:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/sh", "-c"]
        args:
        - >-
          set -eu;
          chown -R 1001:1001 /var/lib/gitea;
          cp /etc/gitea-template/app.ini /etc/gitea/app.ini;
          password=$(printf '%s' "$GITEA__database__PASSWD" | sed 's/[\\&|]/\\\\&/g');
          sed -i "s|^PASSWD =.*|PASSWD = ${password}|" /etc/gitea/app.ini;
          chown -R 1001:1001 /etc/gitea
        env:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef: {name: gitea-secrets, key: GITEA__database__PASSWD}
        volumeMounts:
        - name: gitea-data
          mountPath: /var/lib/gitea
        - name: gitea-config-template
          mountPath: /etc/gitea-template
        - name: gitea-config-generated
          mountPath: /etc/gitea
      containers:
      - name: gitea
        image: arm-cluster-master:5000/gitea_base:latest
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
        command: ["/bin/sh", "-c"]
        args:
        - /usr/local/bin/gitea web --config /etc/gitea/app.ini
        envFrom:
        - configMapRef:
            name: gitea-env
        env:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-secrets
              key: GITEA__database__PASSWD
        - name: GITEA__security__SECRET_KEY
          valueFrom:
            secretKeyRef: {name: gitea-secrets, key: GITEA__security__SECRET_KEY}
        - name: GITEA__security__INTERNAL_TOKEN
          valueFrom:
            secretKeyRef: {name: gitea-secrets, key: GITEA__security__INTERNAL_TOKEN}
        - name: GITEA__oauth2__JWT_SECRET
          valueFrom:
            secretKeyRef: {name: gitea-secrets, key: GITEA__oauth2__JWT_SECRET}
        volumeMounts:
        - name: gitea-data
          mountPath: /var/lib/gitea
        - name: gitea-config-template
          mountPath: /etc/gitea-template
        - name: gitea-config-generated
          mountPath: /etc/gitea
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: gitea-config-template
        configMap:
          name: gitea-config
      - name: gitea-config-generated
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: gitea-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ceph-rbd
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitops
spec:
  type: ClusterIP
  selector:
    app: gitea
  ports:
  - name: http
    port: 3000
    targetPort: 3000
