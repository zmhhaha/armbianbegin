kind: pipeline
type: kubernetes
name: cpp-build

# Drone performs the authenticated Gitea checkout automatically.
steps:
- name: build-arm64
  image: arm-cluster-master:5000/gcc_compiler:latest
  commands:
    - mkdir build-arm64 && cd build-arm64
    - cmake -DCMAKE_TOOLCHAIN_FILE=/opt/toolchains/arm64.cmake ..
    - make -j$(nproc)

- name: build-x86_64
  image: arm-cluster-master:5000/gcc_compiler:latest
  commands:
    - mkdir build-x86 && cd build-x86
    - cmake -DCMAKE_TOOLCHAIN_FILE=/opt/toolchains/x86_64.cmake ..
    - make -j$(nproc)

- name: static-analysis
  image: arm-cluster-master:5000/gcc_compiler:latest
  commands:
    - cppcheck --enable=all --inconclusive --std=c++17 src/ 2> cppcheck-report.txt
  when:
    event: [push, pull_request]

- name: package-x86
  image: arm-cluster-master:5000/gcc_compiler:latest
  commands:
    - cd build-x86
    - cpack -G DEB
    - mv *.deb ../

- name: package-arm64
  image: arm-cluster-master:5000/gcc_compiler:latest
  commands:
    - cd build-arm64
    - cpack -G DEB
    - mv *.deb ../
