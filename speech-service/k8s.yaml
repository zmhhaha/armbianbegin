apiVersion: v1
kind: Namespace
metadata:
  name: speech-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-service
  namespace: speech-service
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: speech-service}}
  template:
    metadata:
      labels: {app: speech-service}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      nodeSelector:
        kubernetes.io/hostname: orangepi5-max-server1
        kubernetes.io/arch: arm64
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: speech-service
          image: arm-cluster-master:5000/speech-service:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8092}]
          env:
            - {name: SPEECH_BACKEND, value: kokoro_convonly}
            - {name: SPEECH_MODEL, value: kokoro-rk3588}
            - {name: SPEECH_VOICE, value: zm_yunjian}
            - {name: KOKORO_CONVONLY_ROOT, value: /models/kokoro-convonly-rk3588}
            - {name: SPEECH_VOICE_ROOT, value: /models/voices}
            - {name: TOKEN_FILE, value: /run/secrets/speech/token}
          resources:
            requests: {cpu: "1", memory: 3Gi, panghuer.top/rknpu: "1"}
            limits: {cpu: "2", memory: 4Gi, panghuer.top/rknpu: "1"}
          securityContext:
            privileged: false
            # The bootstrap binds a private read-only compatibility view, then
            # drops the entire capability bounding set before starting TTS.
            procMount: Default
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [SYS_ADMIN, SETPCAP]}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: bundle, mountPath: /models/kokoro-convonly-rk3588, readOnly: true}
            - {name: voices, mountPath: /models/voices, readOnly: true}
            - {name: compatible, mountPath: /run/rknpu/compatible, readOnly: true}
            - {name: token, mountPath: /run/secrets/speech, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Dedicated, verified directories on the selected RK3588 node.
        - name: bundle
          hostPath:
            path: /root/armbianbegin/speech-service/models/kokoro-convonly-rk3588
            type: Directory
        - name: voices
          hostPath:
            path: /root/armbianbegin/speech-service/models/voices
            type: Directory
        - name: token
          secret: {secretName: speech-service-token, defaultMode: 0400}
        - name: compatible
          hostPath:
            path: /sys/firmware/devicetree/base/compatible
            type: File
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: speech-service
  namespace: speech-service
spec:
  type: ClusterIP
  selector: {app: speech-service}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speech-service
  namespace: speech-service
spec:
  podSelector: {matchLabels: {app: speech-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector: {matchLabels: {speech-client: "true"}}
      ports: [{protocol: TCP, port: 8092}]
  # All model/frontend inputs are local; synthesis needs no network egress.
  egress: []
