apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: data
spec:
  type: ClusterIP
  selector: {app: rag-service}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: {app: rag-service}
  template:
    metadata:
      labels:
        app: rag-service
        # llm-service 的 NetworkPolicy 只放行带此标签的 Pod
        llm-client: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: rag-service
          image: arm-cluster-master:5000/rag-service:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch.data.svc.cluster.local:9200
            - name: ELASTICSEARCH_USERNAME
              value: elastic
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: ELASTIC_PASSWORD
            - name: EMBEDDING_URL
              value: http://embedding-service.data.svc.cluster.local:8080
            - name: LLM_URL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: LLM_URL
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: LLM_MODEL
            - name: LLM_TIMEOUT
              value: "120"
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-llm-secret
                  key: LLM_SERVICE_TOKEN
                  optional: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: data
data:
  # 指向集群内统一入口 llm-service；LLM_MODEL 是 llm-service 注册的“模型别名”，不是上游模型名。
  # provider 凭据由 llm-service 持有，这里不再保存任何 provider API Key。
  LLM_URL: http://llm-service.llm.svc.cluster.local/v1/chat/completions
  LLM_MODEL: chat-default
