apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: data
spec:
  type: ClusterIP
  selector: {app: embedding-service}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: data
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: embedding-service}}
  template:
    metadata: {labels: {app: embedding-service}}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        # 2026-09-27 由 orangepi5-max-server1 挪到 master。本服务**没有任何卷挂载**
        # （无 PVC / emptyDir / hostPath），移动无数据风险；而 orangepi5-max 实测内存
        # 83%（13200Mi）是全体最紧的一台，master 只有 13% CPU / 54% 内存。
        # ⚠️ 三个被挪的服务里它最重（limit 4 CPU / 1Gi），且摄入时 CPU 突发——
        # master 上跑着 etcd/apiserver，挪完留意控制面延迟。若异常，把这一条改回去即可。
        kubernetes.io/hostname: arm-cluster-master
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: embedding-service
          image: arm-cluster-master:5000/embedding-service:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          env: [{name: ORT_INTRA_OP_THREADS, value: "4"}]
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "4", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
---
# ⚠️ 2026-09-29 实测：**这条策略在集群里不存在**。全集群共 13 条 NetworkPolicy，`data`
# 命名空间下只有 `rag-service` 那一条——本文件声明的 embedding-service 那条不在其中。
# 也就是说上面「只允许带 embedding-client 标签的 Pod 调用」目前不成立，本服务实际是敞开的。
# 要么应用它，要么删掉这段声明；这是所有者的决定（应用前同样要先确认调用方都带了标签）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: embedding-service
  namespace: data
spec:
  podSelector: {matchLabels: {app: embedding-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {embedding-client: "true"}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
