# 佛法无边 Agent — model-provider credentials.
# PROVIDER is configured in the agent-config ConfigMap (namespace fofawubian-agent).
# Credentials, base URLs, and model names are stored in Vault under
#   secret/data/fofawubian-agent/api
# The resulting Secret `agent-secret` is consumed by the API deployment.
#
# Example (DeepSeek only; add OPENAI_* / CUSTOM_* only if you switch provider):
#   kubectl exec -n vault vault-0 -- vault kv put secret/fofawubian-agent/api \
#     DEEPSEEK_API_KEY="sk-xxx" \
#     DEEPSEEK_BASE_URL="https://api.deepseek.com" \
#     DEEPSEEK_MODEL="deepseek-v4-flash"
#
# ── apply ────────────────────────────────────────────────
#   kubectl apply -f inventory/fofawubian-agent-externalsecret.yaml
#
# ── 强制 ESO 立即同步 ────────────────────────────────────
#   kubectl annotate externalsecret agent-secret -n fofawubian-agent \
#     force-sync=$(date +%s) --overwrite
#
# ── 更新后重启 Pod（环境变量只在 Pod 启动时注入） ────────
#   kubectl rollout restart deployment api -n fofawubian-agent
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secret
  namespace: fofawubian-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/fofawubian-agent/api
