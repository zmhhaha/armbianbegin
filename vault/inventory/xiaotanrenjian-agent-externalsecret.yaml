# 笑谈人间 Agent - model-provider credentials.
# PROVIDER is configured in the agent-config ConfigMap.
# Credentials are stored in Vault under secret/data/xiaotanrenjian-agent/api.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secret
  namespace: xiaotanrenjian-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/xiaotanrenjian-agent/api
