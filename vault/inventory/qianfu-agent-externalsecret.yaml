# Optional QianFu model-provider credentials.
# PROVIDER is configured in deploy/k8s/agent-configmap.yaml.
# All provider credentials, base URLs, and model names remain in Vault.
#
# Example:
#   vault kv put secret/qianfu/agent \
#     OPENAI_API_KEY="..." OPENAI_BASE_URL="https://api.openai.com/v1" OPENAI_MODEL="gpt-4o-mini"
#     DEEPSEEK_API_KEY="..." DEEPSEEK_BASE_URL="https://api.deepseek.com" DEEPSEEK_MODEL="deepseek-v4-flash"
#
# The extract form allows only the selected provider's fields to exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qianfu-agent
  namespace: qianfu
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: qianfu-agent
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/qianfu/agent
