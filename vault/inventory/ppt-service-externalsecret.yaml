# PPT workbench credentials for the existing data/postgres instance. Create the
# ppt-service namespace, provision these three paths, then apply. PPT keeps its
# own ppt_service database and two least-privilege roles. Shared PostgreSQL
# administrator credentials are never projected to PPT. See PPT-SERVICE.md.
# The retired ppt-postgres-bootstrap Secret/Vault path is not created here;
# retain existing legacy credentials and storage for a controlled rollback.
# Public client ID, issuer, domain and model routing are not credentials and do
# not belong in this file. No upstream provider key or long-lived LLM caller token
# is projected to the site, database, migration Job or Pi Worker.
# Vault CLI paths omit data/; remoteRef follows this repository's KV v2 convention.
# Each target has one owner and explicit keys; never replace this with dataFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-oidc
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: secret/data/ppt-service/oidc
        property: CLIENT_SECRET
    - secretKey: cookie-secret
      remoteRef:
        key: secret/data/ppt-service/oidc
        property: COOKIE_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-database-runtime
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-database-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/ppt-service/database-runtime
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-database-migrator
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-database-migrator
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/ppt-service/database-migrator
        property: DATABASE_URL
