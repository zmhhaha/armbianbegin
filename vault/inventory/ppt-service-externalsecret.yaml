# PPT workbench deployment credentials. DECLARATION ONLY: create the namespace
# and provision postgres-bootstrap first, then apply; other paths may sync later.
# Start PG after bootstrap is Ready; create DB roles before migration, and make
# runtime/OIDC credentials Ready before starting the site. See PPT-SERVICE.md.
# Public client ID, issuer, domain and model routing are not credentials and do
# not belong in this file. No upstream provider key or long-lived LLM caller token
# is projected to the site, database, migration Job or Pi Worker.
# Vault CLI paths omit data/; remoteRef follows this repository's KV v2 convention.
# Each target has one owner and explicit keys; never replace this with dataFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-oidc
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: secret/data/ppt-service/oidc
        property: CLIENT_SECRET
    - secretKey: cookie-secret
      remoteRef:
        key: secret/data/ppt-service/oidc
        property: COOKIE_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-database-runtime
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-database-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/ppt-service/database-runtime
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-database-migrator
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-database-migrator
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/ppt-service/database-migrator
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-postgres-bootstrap
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-postgres-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/ppt-service/postgres-bootstrap
        property: POSTGRES_PASSWORD
