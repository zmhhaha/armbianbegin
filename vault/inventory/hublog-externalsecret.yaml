# ============================================================
# Hublog — ExternalSecret
#
# 部署方式：通常由 panghu_chat/hublog/deploy.sh 自动写入 Vault 并应用。
# 手工写入时，vault kv put 的路径不要包含 data/：
#   vault kv put secret/hublog/database DATABASE_URL='postgresql+asyncpg://...'
#   vault kv put secret/hublog/redis REDIS_URL='redis://:...@redis.data.svc.cluster.local:6379/0'
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hublog-config
  namespace: hublog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hublog-config
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/hublog/database
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/data/hublog/redis
        property: REDIS_URL
