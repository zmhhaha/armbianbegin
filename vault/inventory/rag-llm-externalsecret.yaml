# ============================================================
#  rag-service - 调用 llm-service 的**专属**令牌
#
#  RAG 不再保存任何 provider API Key；它只需要 llm-service 的调用令牌。
#  令牌从 secret/llm-service/callers 里只取 LLM_TOKEN_RAG 这一个键，
#  与其它调用方互不可见。
#
#  前置：Vault 中 secret/llm-service/callers 已写入 LLM_TOKEN_RAG（与其它调用方的令牌一起），
#        llm-service/deploy.sh 会引导写入。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-llm-secret
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-llm-secret
    creationPolicy: Owner
  data:
    - secretKey: LLM_SERVICE_TOKEN
      remoteRef:
        key: secret/data/llm-service/callers
        property: LLM_TOKEN_RAG
