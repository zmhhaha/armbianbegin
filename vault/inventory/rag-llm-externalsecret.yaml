# ============================================================
# rag-service - 调用 llm-service 的内部令牌
#
# RAG 不再保存任何 provider API Key；它只需要 llm-service 的调用令牌。
# 令牌与 llm-service 同源（secret/llm-service/auth），避免各服务各存一份。
#
# 前置：Vault 中已存在 secret/llm-service/auth（含 LLM_SERVICE_TOKEN），
#       llm-service/deploy.sh 或手工执行过：
#   kubectl exec -n vault vault-0 -- vault kv put secret/llm-service/auth \
#     LLM_SERVICE_TOKEN="$(openssl rand -hex 32)"
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-llm-secret
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-llm-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/llm-service/auth
