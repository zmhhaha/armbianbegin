# ============================================================
# Elasticsearch - ExternalSecret
#
# 用途:
#   将 Vault KV v2 中的 Elasticsearch 管理员密码同步为
#   data/elasticsearch-secret，供 Elasticsearch StatefulSet 使用。
#
# 部署方式（在仓库根目录执行）:
#   1. 生成密码并写入 Vault。vault kv put 的路径不要包含 data/：
#      ELASTIC_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9_@#%+=' | head -c 24)"
#      kubectl exec -n vault vault-0 -- vault kv put secret/elasticsearch/app \
#        ELASTIC_PASSWORD="${ELASTIC_PASSWORD}"
#      unset ELASTIC_PASSWORD
#
#   2. 创建 ExternalSecret：
#      kubectl apply -f vault/inventory/elasticsearch-externalsecret.yaml
#
#   3. 等待同步并检查状态：
#      kubectl wait --for=condition=Ready \
#        externalsecret/elasticsearch-secret -n data --timeout=90s
#      kubectl get secret elasticsearch-secret -n data
#
#   4. 部署 Elasticsearch：
#      cd es && bash deploy.sh
#
# 路径说明:
#   Vault CLI 写入路径: secret/elasticsearch/app
#   ExternalSecret 读取路径: secret/data/elasticsearch/app
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elasticsearch-secret
  namespace: data
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: elasticsearch-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ELASTIC_PASSWORD
      remoteRef:
        key: secret/data/elasticsearch/app
        property: ELASTIC_PASSWORD
