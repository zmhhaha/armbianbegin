# Optional ShaPan model-provider credentials.
# Example Vault path: secret/shapan/agent
# kubectl exec -n vault vault-0 -- vault kv put secret/shapan/agent \
#   DEEPSEEK_API_KEY="<api-key>" \
#   DEEPSEEK_BASE_URL="https://api.deepseek.com" \
#   DEEPSEEK_MODEL="deepseek-v4-flash"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shapan-agent
  namespace: shapan
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: shapan-agent
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/shapan/agent
