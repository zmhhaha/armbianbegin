# Optional feature: populate Vault first, then explicitly apply this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-github-ssh
  namespace: hermes
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: hermes-github-ssh, creationPolicy: Owner}
  data:
    - secretKey: id_ed25519
      remoteRef: {key: secret/data/hermes/github, property: id_ed25519}
    - secretKey: known_hosts
      remoteRef: {key: secret/data/hermes/github, property: known_hosts}
