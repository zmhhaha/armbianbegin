# Gitea and Drone ExternalSecrets. Values are stored in Vault under
# secret/data/gitops/gitea and secret/data/gitops/drone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-secrets
  namespace: gitops
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: gitea-secrets, creationPolicy: Owner}
  data:
  - secretKey: GITEA__database__PASSWD
    remoteRef: {key: secret/data/gitops/gitea, property: GITEA_POSTGRES_PASSWORD}
  - secretKey: GITEA__security__SECRET_KEY
    remoteRef: {key: secret/data/gitops/gitea, property: GITEA_SECRET_KEY}
  - secretKey: GITEA__security__INTERNAL_TOKEN
    remoteRef: {key: secret/data/gitops/gitea, property: GITEA_INTERNAL_TOKEN}
  - secretKey: GITEA__oauth2__JWT_SECRET
    remoteRef: {key: secret/data/gitops/gitea, property: GITEA_OAUTH2_JWT_SECRET}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: drone-server-secrets, namespace: gitops}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: drone-server-secrets, creationPolicy: Owner}
  data:
  - secretKey: DRONE_GITEA_CLIENT_ID
    remoteRef: {key: secret/data/gitops/drone, property: DRONE_GITEA_CLIENT_ID}
  - secretKey: DRONE_GITEA_CLIENT_SECRET
    remoteRef: {key: secret/data/gitops/drone, property: DRONE_GITEA_CLIENT_SECRET}
  - secretKey: DRONE_RPC_SECRET
    remoteRef: {key: secret/data/gitops/drone, property: DRONE_RPC_SECRET}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: drone-runner-secrets, namespace: gitops}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: drone-runner-secrets, creationPolicy: Owner}
  data:
  - secretKey: DRONE_RPC_SECRET
    remoteRef: {key: secret/data/gitops/drone, property: DRONE_RPC_SECRET}
