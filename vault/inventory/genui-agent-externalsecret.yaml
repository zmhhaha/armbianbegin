# Optional GenUI model-provider credentials.
# The service remains fully usable with deterministic UI generation when this
# secret is absent or GENUI_PROVIDER is set to fallback.
#
# Example:
#   kubectl exec -n vault vault-0 -- vault kv put secret/genui/agent \
#     OPENAI_API_KEY="..." \
#     OPENAI_BASE_URL="https://api.openai.com/v1" \
#     OPENAI_MODEL="gpt-4o-mini"
# Or use a DeepSeek-compatible endpoint:
#     DEEPSEEK_API_KEY="..." \
#     DEEPSEEK_BASE_URL="https://api.deepseek.com/v1" \
#     DEEPSEEK_MODEL="deepseek-chat"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: genui-agent
  namespace: genui
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: genui-agent
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/genui/agent
