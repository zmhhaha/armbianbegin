apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tewu-database
  namespace: tewu
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tewu-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        url: postgresql://appuser:{{ .POSTGRES_PASSWORD }}@postgres.data.svc.cluster.local:5432/appdb
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/postgres/app
        property: POSTGRES_PASSWORD
