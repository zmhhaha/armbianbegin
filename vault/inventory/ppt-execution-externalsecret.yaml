# Hermes execution only. Website/controller/worker never receive this key.
# Reuse the canonical custom provider key without copying the Vault record.
# Vault CLI: secret/llm-service/providers, field CUSTOM_API_KEY
# Only the per-attempt trusted model-proxy Pod references this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-model-upstream
  namespace: ppt-service
  labels:
    app.kubernetes.io/part-of: ppt-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ppt-model-upstream
    creationPolicy: Owner
  data:
    - secretKey: PPT_UPSTREAM_API_KEY
      remoteRef:
        key: secret/data/llm-service/providers
        property: CUSTOM_API_KEY
