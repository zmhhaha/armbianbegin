# ============================================================
# Hublog robot service-token ExternalSecret
#
# 部署方式：Vault 中写入 secret/hublog/auth 后手动 kubectl apply；
# API Deployment 以可选 envFrom 引用此 Secret，未配置机器人凭据时不阻塞 Hublog。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hublog-bot-auth
  namespace: hublog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hublog-bot-auth
    creationPolicy: Owner
  data:
    - secretKey: HUBLOG_SERVICE_TOKENS
      remoteRef:
        key: secret/data/hublog/auth
        property: HUBLOG_SERVICE_TOKENS
