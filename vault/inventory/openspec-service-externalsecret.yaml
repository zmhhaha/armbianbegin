# ============================================================
# OpenSpec Service - ExternalSecret
# 从 Vault 同步 OpenSpec 服务运行所需的数据库连接和 Gitea 服务账号凭据。
#
# Vault 写入示例（KV v2，用 kv patch 避免覆盖已有键）：
#   kubectl exec -n vault vault-0 -- vault kv patch secret/openspec/service \
#     database_url='postgresql://openspec_service:<password>@postgres.data.svc.cluster.local:5432/openspec_service' \
#     gitea_provision_token='<restricted-gitea-token>' \
#     gitea_username='openspec-service' \
#     casdoor_client_secret='<panghu-suite client secret>'
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openspec-service-secrets
  namespace: openspec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openspec-service-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: secret/data/openspec/service
      property: database_url
  - secretKey: GITEA_TOKEN
    remoteRef:
      key: secret/data/openspec/service
      property: gitea_provision_token
  - secretKey: GITEA_USERNAME
    remoteRef:
      key: secret/data/openspec/service
      property: gitea_username
  - secretKey: CASDOOR_CLIENT_SECRET
    remoteRef:
      key: secret/data/openspec/service
      property: casdoor_client_secret
