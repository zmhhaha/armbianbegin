# ============================================================
# OpenSpec Service - ExternalSecret
# 从 Vault 同步 OpenSpec 服务运行所需的数据库连接和 Gitea 服务账号凭据。
#
# Vault 写入示例（KV v2，用 kv patch 避免覆盖已有键）：
#   kubectl exec -n vault vault-0 -- vault kv patch secret/openspec/service \
#     database_url='postgresql://openspec_service:<password>@postgres.data.svc.cluster.local:5432/openspec_service' \
#     gitea_provision_token='<restricted-gitea-token>' \
#     gitea_username='openspec-service' \
#     gitea_webhook_secret='<random-webhook-secret>'
# （casdoor_client_secret 自 2026-10-02 起不再需要，原因见文件末尾注释）
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openspec-service-secrets
  namespace: openspec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openspec-service-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: secret/data/openspec/service
      property: database_url
  - secretKey: GITEA_TOKEN
    remoteRef:
      key: secret/data/openspec/service
      property: gitea_provision_token
  - secretKey: GITEA_USERNAME
    remoteRef:
      key: secret/data/openspec/service
      property: gitea_username
  - secretKey: GITEA_WEBHOOK_SECRET
    remoteRef:
      key: secret/data/openspec/service
      property: gitea_webhook_secret
  # 2026-10-02：原来这里还有一个 CASDOOR_CLIENT_SECRET（GET /token 换 access_token 用）。
  # 该路由已退役 —— 项目申请登录改用 MCP 专用应用（公共客户端，**无需 secret**），
  # 给人取长期 JWT 的那半归档在 oauth/token-dispenser/。所以不再注入这个键。
  # Vault 里那个字段没有删，留着不影响；要清可以自己 `vault kv patch`。
