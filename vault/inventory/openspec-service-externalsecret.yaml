# ============================================================
# OpenSpec Service - ExternalSecret
# 从 Vault 同步 OpenSpec 服务运行所需的数据库连接和 Gitea 服务账号凭据。
#
# Vault 写入示例（KV v2）：
#   vault kv put secret/openspec/service \
#     database_url='postgresql://openspec_service:<password>@<postgres-host>:5432/openspec_service' \
#     gitea_provision_token='<restricted-gitea-token>' \
#     gitea_username='openspec-service'
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openspec-service-secrets
  namespace: openspec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openspec-service-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: secret/data/openspec/service
      property: database_url
  - secretKey: GITEA_TOKEN
    remoteRef:
      key: secret/data/openspec/service
      property: gitea_provision_token
  - secretKey: GITEA_USERNAME
    remoteRef:
      key: secret/data/openspec/service
      property: gitea_username
