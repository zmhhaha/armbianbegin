# 索引作业用的 RAG 身份 —— 是**消费方自己的**，不是所有者的。
#
# collection 名由 token 的环境变量名推导（rag-service 的 auth.py），所以这一个键
# 就决定了语料落进哪个 collection。加了它不需要改 rag-service 的任何东西：
# ExternalSecret 是 dataFrom/单键取，collection 由身份推导，ES 索引模板匹配
# rag-agent-*-v* 自动适用。
#
# KV v2 路径：secret/rag-service/callers
# 这个键**已经存在** —— 就是那个人格用来读自己知识库的同一个身份。
# 确认它存在（只看长度，不打印值）：
#   kubectl -n vault exec vault-0 -- \
#     vault kv get -field=RAG_TOKEN_BINGBICHUNQIU secret/rag-service/callers | wc -c
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-indexer-bingbichunqiu
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-indexer-bingbichunqiu
    creationPolicy: Owner
  data:
    - secretKey: RAG_TOKEN
      remoteRef:
        key: secret/data/rag-service/callers
        property: RAG_TOKEN_BINGBICHUNQIU
