# 索引作业用的 RAG 身份 —— 是**消费方自己的**，不是所有者的。
#
# ⚠️ 这是**模板**：按人格渲染，一个 corpus 一份，由
# `panghu_chat/obsidian/deploy.sh` 按人格名册（registry.yaml）渲染后应用。
# **别直接 kubectl apply 本文件**（占位符没填，会建出一个名字里带 __SLUG__ 的废密钥；
# 渲染出来的是 obsidian-indexer-<slug>）。
#
# 一个人格一份 ExternalSecret = 每个作业的 Pod 只拿得到自己那一个令牌键，拿不到别人的
# —— 与 panghu_agent/k8s/rag-token-externalsecret.yaml 同一立场（那边是每个 Agent 命名
# 空间一份）。注意这是刻意的：不要图省事改成"整段 extract 八把令牌"，那会让任何一个
# 作业都能写进别人的 collection。
#
# collection 名由 token 的环境变量名推导（rag-service 的 auth.py），所以这一个键就决定了
# 语料落进哪个 collection。加人格不需要改 rag-service 的任何东西：单键取，collection 由
# 身份推导，ES 索引模板匹配 rag-agent-*-v* 自动适用。
#
# KV v2 路径：secret/rag-service/callers，八个人格的键名见 rag-service/README.md
# （RAG_TOKEN_<SLUG>）。确认某个键存在（只看长度，不打印值）：
#   kubectl -n vault exec vault-0 -- \
#     vault kv get -field=RAG_TOKEN_BINGBICHUNQIU secret/rag-service/callers | wc -c
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-indexer-__SLUG__
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-indexer-__SLUG__
    creationPolicy: Owner
  data:
    - secretKey: RAG_TOKEN
      remoteRef:
        key: secret/data/rag-service/callers
        property: __VAULT_TOKEN_KEY__
