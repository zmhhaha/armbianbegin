# 索引作业用的 RAG 身份 —— 是**消费方自己的**，不是所有者的。
#
# collection 名由 token 的环境变量名推导（rag-service 的 auth.py），所以一个键
# 就决定了语料落进哪个 collection。加一个人格不需要改 rag-service 的任何东西：
# ExternalSecret 是单键取，collection 由身份推导，ES 索引模板匹配
# rag-agent-*-v* 自动适用。
#
# **一个人格一份**（对应 panghu_chat/obsidian/k8s/indexer.yaml 里的一个 CronJob）：
# 身份不同 → collection 不同，所以《百家争鸣》下各人格的语料互不可见。
#
# KV v2 路径：secret/rag-service/callers
# 这些键**已经存在** —— 就是那个人格用来读自己知识库的同一个身份。
# 确认某个键存在（只看长度，不打印值）：
#   kubectl -n vault exec vault-0 -- \
#     vault kv get -field=RAG_TOKEN_BINGBICHUNQIU secret/rag-service/callers | wc -c
# 八个人格的键名见 rag-service/README.md（RAG_TOKEN_<SLUG>，SLUG 大写）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-indexer-bingbichunqiu
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-indexer-bingbichunqiu
    creationPolicy: Owner
  data:
    - secretKey: RAG_TOKEN
      remoteRef:
        key: secret/data/rag-service/callers
        property: RAG_TOKEN_BINGBICHUNQIU
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-indexer-daofaziran
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-indexer-daofaziran
    creationPolicy: Owner
  data:
    - secretKey: RAG_TOKEN
      remoteRef:
        key: secret/data/rag-service/callers
        property: RAG_TOKEN_DAOFAZIRAN
