# ============================================================
# rag-service - 调用者令牌
#
# 每个调用者一个令牌，注入为环境变量 RAG_TOKEN_<CALLER>（大写、连字符换成下划线）：
#   RAG_TOKEN_DAOFAZIRAN、RAG_TOKEN_FOFAWUBIAN、RAG_TOKEN_RAG_OPERATOR ...
# 服务端据此推导调用者身份（绝不采信请求体里的 agent/collection 字段）。
#
# 写入 Vault（KV v2 省略 data/ 前缀）：
#   kubectl exec -n vault vault-0 -- vault kv put secret/rag-service/callers \
#     RAG_TOKEN_DAOFAZIRAN="$(openssl rand -hex 32)" \
#     RAG_TOKEN_FOFAWUBIAN="$(openssl rand -hex 32)" \
#     RAG_TOKEN_ZHONGGUI...="$(openssl rand -hex 32)" \
#     RAG_TOKEN_RAG_OPERATOR="$(openssl rand -hex 32)"
#
# 八个合规周礼 Agent 各用一个令牌；RAG_TOKEN_RAG_OPERATOR 供运维使用，
# 其通配权限在 rag-config ConfigMap 的 CALLER_PERMISSIONS 里声明。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-callers-secret
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-callers-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/rag-service/callers
