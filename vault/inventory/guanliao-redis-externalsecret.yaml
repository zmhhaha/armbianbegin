apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guanliao-redis-secret
  namespace: oauth
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: guanliao-redis-secret, creationPolicy: Owner }
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: secret/data/redis/app, property: REDIS_PASSWORD }
