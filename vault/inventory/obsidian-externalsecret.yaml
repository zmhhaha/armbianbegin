# CouchDB administrator credentials, used only to bootstrap the node and for
# administrative access through the API. The Obsidian devices never see these;
# they authenticate with JWT.
#
# KV v2 path: secret/obsidian/couchdb
# Create it outside Git before applying this manifest:
#   kubectl exec -n vault vault-0 -- vault kv put secret/obsidian/couchdb \
#     COUCHDB_USER='obsidian' \
#     COUCHDB_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-couchdb
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-couchdb
    creationPolicy: Owner
  data:
    - secretKey: COUCHDB_USER
      remoteRef:
        key: secret/data/obsidian/couchdb
        property: COUCHDB_USER
    - secretKey: COUCHDB_PASSWORD
      remoteRef:
        key: secret/data/obsidian/couchdb
        property: COUCHDB_PASSWORD
---
# The Setup URI that configures the materializer.
#
# This is the single most sensitive value in the design: it carries the
# CouchDB endpoint, the credentials and the end-to-end encryption passphrase,
# which together are enough to read every note. It is stored in HashiCorp
# Vault, mounted as a file, and never placed in a ConfigMap, an environment
# variable, a log line or the repository.
#
# KV v2 path: secret/obsidian/livesync
# Generate the URI on the first configured device and put it here:
#   kubectl exec -n vault vault-0 -- vault kv put secret/obsidian/livesync \
#     SETUP_URI='obsidian://setuplivesync?settings=...'
#
# Rotating it invalidates nothing by itself; the passphrase inside it is what
# decrypts the vault, so treat a change here as a passphrase migration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-livesync
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-livesync
    creationPolicy: Owner
  data:
    - secretKey: setup-uri
      remoteRef:
        key: secret/data/obsidian/livesync
        property: SETUP_URI
