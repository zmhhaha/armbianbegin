# KV v2 path: secret/obsidian/oidc
# Create namespace obsidian before applying this manifest.
# Create it outside Git before applying this manifest:
# kubectl exec -n vault vault-0 -- vault kv put secret/obsidian/oidc \
#   OAUTH2_PROXY_CLIENT_ID='...' \
#   OAUTH2_PROXY_CLIENT_SECRET='...' \
#   OAUTH2_PROXY_COOKIE_SECRET='...'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-oidc
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-oidc
    creationPolicy: Owner
  data:
  - secretKey: OAUTH2_PROXY_CLIENT_ID
    remoteRef:
      key: secret/data/obsidian/oidc
      property: OAUTH2_PROXY_CLIENT_ID
  - secretKey: OAUTH2_PROXY_CLIENT_SECRET
    remoteRef:
      key: secret/data/obsidian/oidc
      property: OAUTH2_PROXY_CLIENT_SECRET
  - secretKey: OAUTH2_PROXY_COOKIE_SECRET
    remoteRef:
      key: secret/data/obsidian/oidc
      property: OAUTH2_PROXY_COOKIE_SECRET
