# CouchDB server secrets: the administrator credentials and the JWT
# verification key.
#
# KV v2 path: secret/obsidian/couchdb
#
# Both values are generated once and live only in Vault. Nothing generated is
# ever pasted into a version-controlled file, so the CouchDB ConfigMap and this
# manifest stay identical across deployments and across key rotations.
#
# Create the credentials outside Git before applying this manifest:
#
#   kubectl exec -n vault vault-0 -- vault kv put secret/obsidian/couchdb \
#     COUCHDB_USER='obsidian' \
#     COUCHDB_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40)"
#
# Then generate the JWT key pair, build the ini fragment and patch it in:
#
#   openssl ecparam -name secp521r1 -genkey -noout \
#     | openssl pkcs8 -topk8 -inform PEM -nocrypt -out private_key.pem
#   openssl ec -in private_key.pem -pubout -outform PEM -out public_key.pem
#   { echo '[jwt_keys]'
#     printf 'ec:obsidian = '
#     awk 'BEGIN{ORS=""} {print $0 "\\n"}' public_key.pem
#     echo
#   } > jwt_keys.ini
#   kubectl exec -i -n vault vault-0 -- \
#     vault kv patch secret/obsidian/couchdb jwt_keys.ini=- < jwt_keys.ini
#
# Why the ini fragment is the Secret value rather than just the key: CouchDB
# has to see the [jwt_keys] section in a file under etc/local.d/, and a
# ConfigMap cannot interpolate a Vault value. The Secret is mounted as that
# file, so the key never has to be committed anywhere.
#
# "ec:obsidian" is the key id. It must equal the `kid` configured in the
# Obsidian plugin on every device.
#
# private_key.pem is what each Obsidian device is configured with. It is not a
# server secret: it must never go into Vault, into Git, or be left on the
# server once distributed to the devices.
#
# Rotation, for a lost device: generate a new pair under a NEW key id
# (ec:obsidian2), patch it into this path alongside the existing one,
# re-onboard the remaining devices, then remove the old id. Overwriting the
# only key an existing device can use locks that device out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-couchdb
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-couchdb
    creationPolicy: Owner
  data:
    - secretKey: COUCHDB_USER
      remoteRef:
        key: secret/data/obsidian/couchdb
        property: COUCHDB_USER
    - secretKey: COUCHDB_PASSWORD
      remoteRef:
        key: secret/data/obsidian/couchdb
        property: COUCHDB_PASSWORD
    # Mounted at /opt/couchdb/etc/local.d/jwt_keys.ini. The Secret key name is
    # also the file name, so what it contains is obvious from the manifest.
    - secretKey: jwt_keys.ini
      remoteRef:
        key: secret/data/obsidian/couchdb
        property: jwt_keys.ini
---
# The Setup URI that configures the materializer, plus the passphrase that
# decrypts it.
#
# This is the single most sensitive pair in the design: together they carry the
# CouchDB endpoint, the credentials and the end-to-end encryption passphrase --
# enough to read every note. They live in HashiCorp Vault, are mounted as
# files, and never appear in a ConfigMap, an environment variable, a log line
# or the repository.
#
# Both halves are required. The plugin's "Encrypt your settings" option
# encrypts the settings payload inside the URI, and the CLI's `setup` command
# prompts for a passphrase unconditionally -- verified with a URI that had no
# passphrase parameter at all: it still prompted, and empty input failed with
# "Passphrase is required". There is no --passphrase flag. The passphrase is
# read from stdin, so the materializer feeds it that way.
#
# KV v2 path: secret/obsidian/livesync
# Generate the URI on the first configured device and put both values here:
#   kubectl exec -n vault vault-0 -- vault kv put secret/obsidian/livesync \
#     SETUP_URI='obsidian://setuplivesync?settings=...' \
#     SETUP_URI_PASSPHRASE='...'
#
# Store the two in different places: the URI is worthless without the
# passphrase and vice versa, so keeping them together defeats the separation.
# Rotating either one means regenerating the Setup URI and re-running this.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-livesync
  namespace: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-livesync
    creationPolicy: Owner
  data:
    - secretKey: setup-uri
      remoteRef:
        key: secret/data/obsidian/livesync
        property: SETUP_URI
    - secretKey: setup-uri-passphrase
      remoteRef:
        key: secret/data/obsidian/livesync
        property: SETUP_URI_PASSPHRASE
