# KV v2: CLI path secret/hermes/*; remoteRef follows repository secret/data/* convention.
# Create namespace hermes first. Never commit actual credential values.
# kubectl exec -n vault vault-0 -- vault kv put secret/hermes/model \
#   DEEPSEEK_API_KEY='...'
# kubectl exec -n vault vault-0 -- vault kv put secret/hermes/oidc \
#   OAUTH2_PROXY_CLIENT_ID='...' OAUTH2_PROXY_CLIENT_SECRET='...' OAUTH2_PROXY_COOKIE_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-model
  namespace: hermes
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: hermes-model, creationPolicy: Owner}
  dataFrom:
    - extract:
        key: secret/data/hermes/model
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-oidc
  namespace: hermes
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: hermes-oidc, creationPolicy: Owner}
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef: {key: secret/data/hermes/oidc, property: OAUTH2_PROXY_CLIENT_ID}
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef: {key: secret/data/hermes/oidc, property: OAUTH2_PROXY_CLIENT_SECRET}
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef: {key: secret/data/hermes/oidc, property: OAUTH2_PROXY_COOKIE_SECRET}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-hublog
  namespace: hermes
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: hermes-hublog
    creationPolicy: Owner
  data:
    - secretKey: HUBLOG_SERVICE_TOKENS
      remoteRef: {key: secret/data/hermes/auth, property: HUBLOG_SERVICE_TOKENS}
---
# oauth2-proxy 的 Redis 会话存储密码（2026-10-15 起 dsh/hermes/pi 的代理改存 Redis，
# cookie 里只留一个会话 ID，避免会话超 4KB 被拆成多个 cookie 后把 Cookie 头撑爆）。
# 与 data/redis-secret、oauth/guanliao-redis-secret 取的是同一个 Vault 路径 ✓
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-redis
  namespace: hermes
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: oauth2-proxy-redis, creationPolicy: Owner }
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: secret/data/redis/app, property: REDIS_PASSWORD }
