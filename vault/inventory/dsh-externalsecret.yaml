# KV v2: CLI path secret/dsh/*; remoteRef follows repository secret/data/* convention.
# Create namespaces dsh and dsh-runners first. Never commit actual credential values.
# kubectl exec -n vault vault-0 -- vault kv put secret/dsh/model \
#   DEEPSEEK_API_KEY='...'
# kubectl exec -n vault vault-0 -- vault kv put secret/dsh/oidc \
#   OAUTH2_PROXY_CLIENT_ID='...' OAUTH2_PROXY_CLIENT_SECRET='...' OAUTH2_PROXY_COOKIE_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
#
# The SSH transport keypair. Generate both halves outside Git, then load all
# five values into one Vault path; the two ExternalSecrets below split them by
# which side of the connection may hold them.
#   ssh-keygen -t ed25519 -N '' -C dsh-client -f /secure/dsh-client
#   ssh-keygen -t ed25519 -N '' -C dsh-host   -f /secure/dsh-host
# known_hosts pins the runner's host key. The alias dsh-runner-<project>
# expands to <alias>.dsh-runners.svc.cluster.local (see config/ssh_config), so
# this can be produced before the runner ever starts:
#   printf '[dsh-runner-<project>.dsh-runners.svc.cluster.local]:2222 %s\n' \
#     "$(cut -d' ' -f1,2 /secure/dsh-host.pub)" > /secure/known_hosts
#   kubectl exec -n vault vault-0 -- vault kv put secret/dsh/ssh \
#     id_ed25519=@/secure/dsh-client id_ed25519.pub=@/secure/dsh-client.pub \
#     ssh_host_ed25519_key=@/secure/dsh-host ssh_host_ed25519_key.pub=@/secure/dsh-host.pub \
#     known_hosts=@/secure/known_hosts
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-model
  namespace: dsh
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: dsh-model, creationPolicy: Owner}
  dataFrom:
    - extract:
        key: secret/data/dsh/model
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-oidc
  namespace: dsh
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: dsh-oidc, creationPolicy: Owner}
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef: {key: secret/data/dsh/oidc, property: OAUTH2_PROXY_CLIENT_ID}
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef: {key: secret/data/dsh/oidc, property: OAUTH2_PROXY_CLIENT_SECRET}
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef: {key: secret/data/dsh/oidc, property: OAUTH2_PROXY_COOKIE_SECRET}
---
# Client half: stays in the dsh namespace and is mounted only in the web pod,
# which is the trusted service that owns the transport credential. It is never
# mounted into a project container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-ssh-client
  namespace: dsh
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: dsh-ssh-client, creationPolicy: Owner}
  data:
    - secretKey: id_ed25519
      remoteRef: {key: secret/data/dsh/ssh, property: id_ed25519}
    - secretKey: known_hosts
      remoteRef: {key: secret/data/dsh/ssh, property: known_hosts}
---
# Host half: lives in dsh-runners. `authorized_keys` is the client's public key
# renamed to what sshd reads, so the trust relationship is stated once in Vault
# and cannot drift between the two sides. The host's private key is mounted
# into project containers; the client's is not, and vice versa.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-ssh-host
  namespace: dsh-runners
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: dsh-ssh-host, creationPolicy: Owner}
  data:
    - secretKey: ssh_host_ed25519_key
      remoteRef: {key: secret/data/dsh/ssh, property: ssh_host_ed25519_key}
    - secretKey: ssh_host_ed25519_key.pub
      remoteRef: {key: secret/data/dsh/ssh, property: ssh_host_ed25519_key.pub}
    - secretKey: authorized_keys
      remoteRef: {key: secret/data/dsh/ssh, property: id_ed25519.pub}
