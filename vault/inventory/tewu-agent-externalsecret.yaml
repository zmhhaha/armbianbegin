# TeWu model-provider credentials. Seed this path independently in Vault.
# The resulting Secret exists only in the tewu namespace and is consumed by tewu-server.
# kubectl exec -n vault vault-0 -- vault kv put secret/tewu/agent \
#   DEEPSEEK_API_KEY="<api-key>" \
#   DEEPSEEK_BASE_URL="https://api.deepseek.com" \
#   DEEPSEEK_MODEL="deepseek-v4-flash"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tewu-agent
  namespace: tewu
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tewu-agent
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/tewu/agent
