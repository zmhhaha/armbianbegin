# Game Review Agent — model-provider credentials.
# PROVIDER is configured in deploy-api.sh (agent-config ConfigMap).
# Credentials, base URLs, and model names are stored in Vault under
#   secret/data/game-review-agent/api
# The resulting Secret `agent-secret` is consumed by the API deployment.
#
# Example (DeepSeek only; add OPENAI_* / CUSTOM_* only if you switch provider):
#   kubectl exec -n vault vault-0 -- vault kv put secret/game-review-agent/api \
#     DEEPSEEK_API_KEY="sk-xxx" \
#     DEEPSEEK_BASE_URL="https://api.deepseek.com" \
#     DEEPSEEK_MODEL="deepseek-v4-flash"
#
# ── apply ────────────────────────────────────────────────
#   kubectl apply -f inventory/game-review-agent-externalsecret.yaml
#
# ── 强制 ESO 立即同步 ────────────────────────────────────
#   kubectl annotate externalsecret agent-secret -n game-review-agent \
#     force-sync=$(date +%s) --overwrite
#
# ── 更新后重启 Pod（环境变量只在 Pod 启动时注入） ────────
#   kubectl rollout restart deployment api -n game-review-agent
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secret
  namespace: game-review-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/game-review-agent/api
---
# Game Review Agent — 受保护游戏访问 cookie.
# Vault path secret/data/game-review-agent/auth 存在则同步 GAME_AUTH_COOKIE 等；
# 路径不存在时生成空 Secret（不报错），agent 仍可访问公开页面。
#
# Example:
#   kubectl exec -n vault vault-0 -- vault kv put secret/game-review-agent/auth \
#     GAME_AUTH_COOKIE="name=_oauth2_proxy;value=<cookie>;domain=.panghuer.top;path=/;secure"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-auth
  namespace: game-review-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: game-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/game-review-agent/auth
