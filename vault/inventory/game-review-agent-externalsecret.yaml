# ============================================================
#  Game Review Agent — ExternalSecret
#  作用: 从 Vault 同步 LLM API Key + 游戏访问 cookie 到 K8s Secret
#
#  ⚠️ ConfigMap（agent-config）不走 ESO：ESO v2.7.0 CRD 无法生成 ConfigMap，
#     需手动创建，见下。
#
#  ── 写入 Vault ──────────────────────────────────────────
#  kubectl exec -n vault vault-0 -- vault kv put secret/game-review-agent/api \
#    OPENAI_API_KEY="sk-xxx" \
#    CUSTOM_API_KEY="sk-xxx"
#
#  kubectl exec -n vault vault-0 -- vault kv put secret/game-review-agent/auth \
#    GAME_AUTH_COOKIE="name=_oauth2_proxy;value=<cookie>;domain=.panghuer.top;path=/;secure"
#    # 或 GAME_AUTH_COOKIES_JSON='[{"name":"_oauth2_proxy","value":"...","domain":".panghuer.top","path":"/","secure":true}]'
#
#  ── apply ExternalSecret ──────────────────────────────
#  kubectl apply -f inventory/game-review-agent-externalsecret.yaml
#
#  ── 创建 ConfigMap（手动）─────────────────────────────
#  kubectl create configmap agent-config -n game-review-agent \
#    --from-literal=PROVIDER=custom \
#    --from-literal=CUSTOM_API_BASE=http://47.109.107.37/v1 \
#    --from-literal=CUSTOM_MODEL=deepseek-v4-pro \
#    --dry-run=client -o yaml | kubectl apply -f -
#
#  ── 强制 ESO 立即同步 ──────────────────────────────────
#  kubectl annotate externalsecret agent-secret -n game-review-agent \
#    force-sync=$(date +%s) --overwrite
#  kubectl annotate externalsecret game-auth -n game-review-agent \
#    force-sync=$(date +%s) --overwrite
#
#  ── 更新后重启 Pod（环境变量只在 Pod 启动时注入） ──────
#  kubectl rollout restart deployment api -n game-review-agent
#  kubectl rollout status deployment api -n game-review-agent
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secret
  namespace: game-review-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: secret/data/game-review-agent/api
        property: OPENAI_API_KEY
    - secretKey: CUSTOM_API_KEY
      remoteRef:
        key: secret/data/game-review-agent/api
        property: CUSTOM_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-auth
  namespace: game-review-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: game-auth
    creationPolicy: Owner
  data:
    - secretKey: GAME_AUTH_COOKIE
      remoteRef:
        key: secret/data/game-review-agent/auth
        property: GAME_AUTH_COOKIE
        # 可选：未配置 cookie 时忽略（仅能访问公开页面）
    - secretKey: GAME_AUTH_COOKIES_JSON
      remoteRef:
        key: secret/data/game-review-agent/auth
        property: GAME_AUTH_COOKIES_JSON
