# Game Review Agent — 受保护游戏的登录 cookie。
#
# 本文件不再包含模型凭据：模型调用已统一走集群内 llm-service，
# 凭据只存在于 llm-service 自己的 Secret（vault/inventory/llm-service-externalsecret.yaml）。
# 调用 llm-service 所需的 LLM_SERVICE_TOKEN 由 panghu_agent/k8s/llm-token-externalsecret.yaml
# 注入，与各 Agent 的 Vault api 路径无关。
#
# Vault path secret/data/game-review-agent/auth 存在则同步 GAME_AUTH_COOKIE 等；
# 路径不存在时期望生成空 Secret（不报错），agent 仍可访问公开页面。
#
# Example:
#   kubectl exec -n vault vault-0 -- vault kv put secret/game-review-agent/auth \
#     GAME_AUTH_COOKIE="name=_oauth2_proxy;value=<cookie>;domain=.panghuer.top;path=/;secure"
#
# ── apply ────────────────────────────────────────────────
#   kubectl apply -f inventory/game-review-agent-externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-auth
  namespace: game-review-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: game-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/game-review-agent/auth
