# Dedicated scientific worker credentials. No human Pi/OIDC/Redis credentials.
# Provision the Vault path through the established administrative process.
# SCIENTIFIC_PI_MODEL_API_KEY maps the independent LLM_TOKEN_SCIENTIFIC_PI caller
# directly from the gateway's authoritative Vault record (no duplicate copy).
# It must NOT be copied from the human Pi HOME. No values belong in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scientific-pi-worker
  namespace: scientific-agent
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: scientific-pi-worker
    creationPolicy: Owner
  data:
    - secretKey: SCIENTIFIC_PI_WORKER_TOKEN
      remoteRef:
        key: secret/data/scientific/pi-worker
        property: SCIENTIFIC_PI_WORKER_TOKEN
    - secretKey: SCIENTIFIC_PI_MODEL_API_KEY
      remoteRef:
        key: secret/data/llm-service/callers
        property: LLM_TOKEN_SCIENTIFIC_PI
