# ============================================================
# Panghu Chat S3 - ExternalSecret
#
# 用途:
#   将 Vault KV v2 中的 Ceph RGW/S3 凭据同步为
#   panghu-chat/hubo-s3，供虎博服务使用。
#
# 部署方式（在仓库根目录执行）:
#   1. 按 ceph/rgw/README.md 创建凭据并写入 Vault：
#      cd ceph/rgw
#      S3_ENDPOINT=http://s3.internal.panghuer.top:7480 FORCE=1 \
#        ./create-s3-user.sh hubo "虎博媒体服务" /root/hubo-s3.env
#      ../../vault/scripts/store-s3-credentials.sh \
#        /root/hubo-s3.env secret/panghu-chat/s3
#
#   2. 创建 ExternalSecret：
#      cd ../..
#      kubectl apply -f vault/inventory/panghu-chat-s3-externalsecret.yaml
#
#   3. 强制 ESO 刷新并检查同步状态：
#      kubectl annotate externalsecret hubo-s3 -n panghu-chat \
#        force-sync="$(date +%s)" --overwrite
#      kubectl wait --for=condition=Ready \
#        externalsecret/hubo-s3 -n panghu-chat --timeout=90s
#      kubectl get secret hubo-s3 -n panghu-chat
#
# 路径说明:
#   Vault CLI 写入路径: secret/panghu-chat/s3
#   ExternalSecret 读取路径: secret/data/panghu-chat/s3
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: panghu-chat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubo-s3
  namespace: panghu-chat
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hubo-s3
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_SECRET_ACCESS_KEY
    - secretKey: S3_INTERNAL_ENDPOINT
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_INTERNAL_ENDPOINT
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_PUBLIC_ENDPOINT
    - secretKey: S3_BUCKET
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_BUCKET
    - secretKey: S3_REGION
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_REGION
    - secretKey: S3_FORCE_PATH_STYLE
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_FORCE_PATH_STYLE
