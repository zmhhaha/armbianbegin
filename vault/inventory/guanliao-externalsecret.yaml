# GuanLiao uses the shared PostgreSQL database and an isolated guanliao schema.
# Vault CLI path: secret/postgres/app
# External Secrets KV v2 path: secret/data/postgres/app
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guanliao-database
  namespace: guanliao
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: guanliao-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        url: postgresql://appuser:{{ .POSTGRES_PASSWORD }}@postgres.data.svc.cluster.local:5432/appdb
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/postgres/app
        property: POSTGRES_PASSWORD
