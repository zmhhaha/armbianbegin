# ============================================================
#  tewu -> llm-service 调用令牌
#
#  本服务不再持有任何 provider 凭据：密钥、别名路由与提示词劫持防护都由 llm-service 负责。
#
#  只从 secret/llm-service/callers 里取自己那一个键，拿不到别的调用方的令牌；
#  llm-service 由变量名反推身份（LLM_TOKEN_TEWU -> tewu）。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: tewu
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  data:
    - secretKey: LLM_SERVICE_TOKEN
      remoteRef:
        key: secret/data/llm-service/callers
        property: LLM_TOKEN_TEWU
