# ============================================================
# llm-service - Vault ExternalSecret
#
# 凭据只写在 Vault，不写入 Git。Vault CLI 写入 KV v2 时省略 data/ 前缀：
#
#   kubectl exec -n vault vault-0 -- vault kv put secret/llm-service/providers \
#     DEEPSEEK_API_KEY='...' OPENAI_API_KEY='...'
#
#   kubectl exec -n vault vault-0 -- vault kv put secret/llm-service/auth \
#     LLM_SERVICE_TOKEN="$(openssl rand -hex 32)"
#
# 然后应用本文件（llm-service/deploy.sh 会自动应用并等待同步）：
#   kubectl apply -f vault/inventory/llm-service-externalsecret.yaml
#   kubectl -n llm wait --for=condition=Ready externalsecret/llm-service-secret --timeout=120s
#
# 两个 Vault key 合并进同一个 K8s Secret：providers 提供 provider 凭据，
# auth 提供调用方鉴权令牌 LLM_SERVICE_TOKEN。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-service-secret
  namespace: llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/llm-service/providers
    - extract:
        key: secret/data/llm-service/auth
