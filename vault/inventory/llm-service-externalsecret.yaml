# ============================================================
# llm-service - Vault ExternalSecret
#
# 凭据只写在 Vault，不写入 Git。Vault CLI 写入 KV v2 时省略 data/ 前缀：
#
#   1) provider 凭据（本服务自己用，绝不回传调用方）
#   kubectl exec -n vault vault-0 -- vault kv put secret/llm-service/providers \
#     DEEPSEEK_API_KEY='...'
#
#   2) 调用方令牌（每个调用方一个键，**变量名即身份**）
#      LLM_TOKEN_<CALLER> -> 调用者名 <caller>（小写、下划线换连字符）
#   kubectl exec -n vault vault-0 -- vault kv put secret/llm-service/callers \
#     LLM_TOKEN_ZHOUGONGJIEMENG='...' LLM_TOKEN_ZHONGKUIFUMO='...' \
#     LLM_TOKEN_DAOFAZIRAN='...'     LLM_TOKEN_FOFAWUBIAN='...' \
#     LLM_TOKEN_ZHENZHUZHIDA='...'   LLM_TOKEN_YIMANEILI='...' \
#     LLM_TOKEN_XIAOTANRENJIAN='...' LLM_TOKEN_BINGBICHUNQIU='...' \
#     LLM_TOKEN_RESEARCH='...'       LLM_TOKEN_SCIENTIFIC='...' \
#     LLM_TOKEN_GAME_REVIEW='...'    LLM_TOKEN_LITERATURE_DOWNLOADER='...' \
#     LLM_TOKEN_RAG='...'            LLM_TOKEN_CONTENT_LLM_SERVICE='...'
#
# 然后应用本文件（llm-service/deploy.sh 会自动应用并等待同步）：
#   kubectl apply -f vault/inventory/llm-service-externalsecret.yaml
#   kubectl -n llm wait --for=condition=Ready externalsecret/llm-service-secret --timeout=120s
#
# 两个 Vault 路径合并进同一个 K8s Secret：providers 提供 provider 凭据，
# callers 提供全部调用方令牌（本服务据此判断「谁在调」）。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-service-secret
  namespace: llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/llm-service/providers
    - extract:
        key: secret/data/llm-service/callers
