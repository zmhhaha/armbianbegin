# ShaPan PostgreSQL connection secret.
# ShaPan reuses the shared appdb database and owns only the shapan schema.
# The password is stored in Vault at secret/postgres/app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shapan-database
  namespace: shapan
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: shapan-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        url: postgresql://appuser:{{ .POSTGRES_PASSWORD }}@postgres.data.svc.cluster.local:5432/appdb
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/postgres/app
        property: POSTGRES_PASSWORD
