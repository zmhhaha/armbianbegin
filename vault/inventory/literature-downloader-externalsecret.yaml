# Literature Downloader academic-provider credentials from Vault.
# Seed the corresponding path before applying this resource:
#   vault kv put secret/literature-downloader/api \
#     ACADEMIC_CONTACT_EMAIL=you@example.com \
#     SEMANTIC_SCHOLAR_API_KEY=...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: literature-config
  namespace: literature-downloader
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: literature-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/literature-downloader/api
