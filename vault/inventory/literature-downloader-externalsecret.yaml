# Literature Downloader — optional LLM search-agent credentials.
# PROVIDER, base URL and model are stored in the literature-downloader
# namespace's agent-config ConfigMap. This Secret only supplies credentials.
#
# Example (DeepSeek):
#   kubectl exec -n vault vault-0 -- vault kv put secret/literature-downloader/api \
#     DEEPSEEK_API_KEY="sk-xxx"
#
# Without this Secret or the Vault value, Literature Downloader continues with
# deterministic query expansion and relevance filtering.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secret
  namespace: literature-downloader
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/literature-downloader/api
