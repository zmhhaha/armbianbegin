# Optional model-provider credentials. PROVIDER itself is non-secret and lives
# in GuanLiao/deploy/k8s/agent-configmap.yaml.
#
# Example:
#   kubectl exec -n vault vault-0 -- vault kv put secret/guanliao/agent \
#     DEEPSEEK_API_KEY="..." \
#     DEEPSEEK_BASE_URL="https://api.deepseek.com" \
#     DEEPSEEK_MODEL="deepseek-chat"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guanliao-agent
  namespace: guanliao
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: guanliao-agent
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/guanliao/agent
