# KV v2: CLI path secret/pi/*; remoteRef follows the repository's secret/data/*
# convention. Create namespace pi first. Never commit actual credential values.
#
# kubectl exec -n vault vault-0 -- vault kv put secret/pi/model \
#   DEEPSEEK_API_KEY='...'
# kubectl exec -n vault vault-0 -- vault kv put secret/pi/oidc \
#   OAUTH2_PROXY_CLIENT_ID='...' \
#   OAUTH2_PROXY_CLIENT_SECRET='...' \
#   OAUTH2_PROXY_COOKIE_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
#
# DEEPSEEK_API_KEY is the name Pi itself reads for its DeepSeek provider --
# confirmed against the pinned package's own docs/providers.md, not assumed from
# this repository's convention, which happens to agree.
#
# The Casdoor application behind secret/pi/oidc must have
# https://pi.panghuer.top/oauth2/callback registered as a redirect URL, or the
# login round trip fails at the provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pi-model
  namespace: pi
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: pi-model, creationPolicy: Owner}
  dataFrom:
    - extract:
        key: secret/data/pi/model
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pi-oidc
  namespace: pi
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: pi-oidc, creationPolicy: Owner}
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef: {key: secret/data/pi/oidc, property: OAUTH2_PROXY_CLIENT_ID}
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef: {key: secret/data/pi/oidc, property: OAUTH2_PROXY_CLIENT_SECRET}
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef: {key: secret/data/pi/oidc, property: OAUTH2_PROXY_COOKIE_SECRET}
