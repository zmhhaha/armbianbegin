# 周公解梦 Agent - model-provider credentials.
# Credentials are stored in Vault under:
#   secret/data/zhougongjiemeng-agent/api
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secret
  namespace: zhougongjiemeng-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/zhougongjiemeng-agent/api
