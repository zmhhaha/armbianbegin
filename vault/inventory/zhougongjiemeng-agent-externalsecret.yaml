# 周公解梦 Agent - model-provider credentials.
# PROVIDER is configured in the agent-config ConfigMap (namespace zhougongjiemeng-agent).
# Credentials, base URLs, and model names are stored in Vault under
#   secret/data/zhougongjiemeng-agent/api
# The resulting Secret `agent-secret` is consumed by the API deployment.
#
# Example (DeepSeek only; add OPENAI_* / CUSTOM_* only if you switch provider):
#   kubectl exec -n vault vault-0 -- vault kv put secret/zhougongjiemeng-agent/api \
#     DEEPSEEK_API_KEY="sk-xxx" \
#     DEEPSEEK_BASE_URL="https://api.deepseek.com" \
#     DEEPSEEK_MODEL="deepseek-v4-flash"
#
# Apply and force ESO to synchronize immediately:
#   kubectl apply -f inventory/zhougongjiemeng-agent-externalsecret.yaml
#   kubectl annotate externalsecret agent-secret -n zhougongjiemeng-agent \
#     force-sync=$(date +%s) --overwrite
#
# Restart the API after the Secret has synchronized:
#   kubectl rollout restart deployment api -n zhougongjiemeng-agent
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secret
  namespace: zhougongjiemeng-agent
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/zhougongjiemeng-agent/api
