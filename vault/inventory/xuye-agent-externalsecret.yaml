apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xuye-agent
  namespace: xuye
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: xuye-agent
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/xuye/agent
