# ============================================================
# Content LLM Service - Vault ExternalSecret
#
# Deployment: apply this file (content-llm-service/deploy.sh also does it automatically).
#
# 本服务不再持有 provider 凭据：模型调用统一走集群内 llm-service，
# 它只需要 llm-service 的**专属**调用令牌 —— 从 secret/llm-service/callers
# 里只取 LLM_TOKEN_CONTENT_LLM_SERVICE 这一个键，与其它调用方互不可见。
#
# 前置：Vault 中 secret/llm-service/callers 已写入 LLM_TOKEN_CONTENT_LLM_SERVICE。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-llm-secret
  namespace: content-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: content-llm-secret
    creationPolicy: Owner
  data:
    - secretKey: LLM_SERVICE_TOKEN
      remoteRef:
        key: secret/data/llm-service/callers
        property: LLM_TOKEN_CONTENT_LLM_SERVICE
