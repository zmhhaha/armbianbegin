# ============================================================
# Content LLM Service - Vault ExternalSecret
#
# Deployment: write secret/content-agents/llm in Vault, then apply this file
# (content-llm-service/deploy.sh also applies it automatically).
# Vault KV v2 write path must omit data/:
#   kubectl exec -n vault vault-0 -- vault kv put secret/content-agents/llm DEEPSEEK_API_KEY='...'
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-llm-secret
  namespace: content-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: content-llm-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/content-agents/llm
