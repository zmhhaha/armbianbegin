# ============================================================
# Panghu content agents - Hublog raw service-token envelope
#
# Deployment: write secret/content-agents/auth in Vault, then apply with kubectl.
# This Secret is mounted only by bot Pods. Hublog stores a separate hash-only map.
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-agent-hublog
  namespace: content-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: content-agent-hublog
    creationPolicy: Owner
  data:
    - secretKey: HUBLOG_SERVICE_TOKENS
      remoteRef:
        key: secret/data/content-agents/auth
        property: HUBLOG_SERVICE_TOKENS
