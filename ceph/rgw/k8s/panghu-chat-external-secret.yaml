apiVersion: v1
kind: Namespace
metadata:
  name: panghu-chat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubo-s3
  namespace: panghu-chat
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hubo-s3
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_SECRET_ACCESS_KEY
    - secretKey: S3_INTERNAL_ENDPOINT
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_INTERNAL_ENDPOINT
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_PUBLIC_ENDPOINT
    - secretKey: S3_BUCKET
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_BUCKET
    - secretKey: S3_REGION
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_REGION
    - secretKey: S3_FORCE_PATH_STYLE
      remoteRef:
        key: secret/data/panghu-chat/s3
        property: S3_FORCE_PATH_STYLE
