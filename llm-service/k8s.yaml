apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-service-config-v2
  namespace: llm
immutable: true
data:
  # 只放非敏感路由：provider、上游 base URL、模型别名、默认参数、超时、重试。
  # 凭据一律通过 api_key_env 引用，实际值来自 llm-service-secret（Vault 注入）。
  #
  # 稳定别名 llm-guarded/llm-trusted 由 active_upstream 集中切换；固定路由显式定义。
  # 策略由各别名的 tier 字段决定（见 config.py 的 TIERS）。
  #   custom-guarded   —— tier=guarded，给「用户会写 prompt」的对话型 Agent（禁扩权字段、收紧上限）
  #   custom-trusted   —— tier=trusted，纯文本生成与函数调用
  #                        （RAG、literature_downloader、content-llm-service、research/scientific）
  #   openai-trusted   —— tier=trusted，**预留**：Vault 里还没有 OPENAI_API_KEY，
  #                        点名它会得到 503「缺少凭据」，不影响 readiness。
  # 不配 fallback：别名必须唯一对应一个模型，失败就报错，不跨上游转移。
  LLM_ALIASES: |
    {
      "version": 2,
      "active_upstream": "custom",
      "upstreams": {
        "deepseek": {
          "provider": "deepseek",
          "base_url": "https://api.deepseek.com/v1",
          "model": "deepseek-v4-flash",
          "api_key_env": "DEEPSEEK_API_KEY",
          "max_retries": 2
        },
        "openai": {
          "provider": "openai",
          "base_url": "https://api.openai.com/v1",
          "model": "gpt-4o-mini",
          "api_key_env": "OPENAI_API_KEY",
          "max_retries": 1
        },
        "custom": {
          "provider": "custom",
          "base_url": "https://custom-llm-proxy.panghuer.top/v1",
          "model": "gpt-6-astra",
          "api_key_env": "CUSTOM_API_KEY",
          "max_retries": 1
        }
      },
      "routes": {
        "deepseek-guarded": {
          "tier": "guarded",
          "upstream": "deepseek",
          "timeout_seconds": 60,
          "defaults": {
            "temperature": 0.8
          }
        },
        "deepseek-trusted": {
          "tier": "trusted",
          "upstream": "deepseek",
          "timeout_seconds": 120,
          "defaults": {
            "temperature": 0.7,
            "max_tokens": 2048
          }
        },
        "openai-trusted": {
          "tier": "trusted",
          "upstream": "openai",
          "timeout_seconds": 120
        },
        "custom-guarded": {
          "tier": "guarded",
          "upstream": "custom",
          "timeout_seconds": 60
        },
        "custom-trusted": {
          "tier": "trusted",
          "upstream": "custom",
          "timeout_seconds": 120
        },
        "llm-guarded": {
          "tier": "guarded",
          "upstream": "$active",
          "timeout_seconds": 60
        },
        "llm-trusted": {
          "tier": "trusted",
          "upstream": "$active",
          "timeout_seconds": 120
        }
      },
      "limits": {
        "requests_per_minute_per_caller": 120
      }
    }
  # 防护配置。默认值刻意保守：上线当天行为不变，只多日志。
  #   spotlight/canary —— 唯一会改写发给上游 prompt 的两个机制，所以按档位开关；
  #                      默认只对 guarded 开（用户会写 prompt 的那一档）
  #   detection        —— 扫已知攻击形态：off | log | reject，默认只记不拦（规则匹配误报不低，
  #                      先看一段时间再决定要不要 reject）
  #   canary_action    —— canary 命中后：log | reject，默认只记
  #   report_callers   —— 谁能读 /v1/guard/report 全量汇总；默认空 = 没人能读。
  #                      日报生产者（llm-report 命名空间）需要它。
  LLM_GUARD: |
    {
      "spotlight": {"guarded": true, "trusted": false},
      "canary": {"guarded": true, "trusted": false},
      "canary_action": "log",
      "detection": "log",
      "report_callers": ["llm-report"]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: llm
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: llm-service}}
  template:
    metadata: {labels: {app: llm-service}}
    spec:
      terminationGracePeriodSeconds: 150
      automountServiceAccountToken: false
      nodeSelector:
        # 2026-09-27 由 orangepi5-max-server1 挪到 master。本服务**没有任何卷挂载**
        # （无 PVC / emptyDir / hostPath），移动无数据风险；而 orangepi5-max 实测内存
        # 83%（13200Mi）是全体最紧的一台，master 只有 13% CPU / 54% 内存。
        # 背景与取舍见 resource_scheduler/README.md 的「看负载」一节。
        kubernetes.io/hostname: arm-cluster-master
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llm-service
          image: arm-cluster-master:5000/llm-service:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - configMapRef: {name: llm-service-config-v2}
            - secretRef: {name: llm-service-secret, optional: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: llm
spec:
  # 仅集群内可达：不建 Ingress / NodePort / LoadBalancer / Tunnel / 公网 DNS
  type: ClusterIP
  selector: {app: llm-service}
  ports: [{name: http, port: 80, targetPort: http}]
---
# 2026-10-17 集群实测：此策略已存在。入站要求调用方 Pod 带 llm-client: "true"，
# 出站仅允许 DNS 与 TCP 443；custom 模型通过 VPS HTTPS 代理访问上游 9080。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-service
  namespace: llm
spec:
  podSelector: {matchLabels: {app: llm-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    # 只有显式打上 llm-client: "true" 的 Pod 能调用
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {llm-client: "true"}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    # 出站只放行 DNS 与 HTTPS（上游 provider）；凭据已由 Vault 注入，无需访问 Vault
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
