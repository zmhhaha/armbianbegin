# OAuth configuration and owner allowlist; deployed into the application namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-oauth
  namespace: obsidian
data:
  oauth2-proxy.cfg: |
    http_address = "0.0.0.0:4180"
    provider = "oidc"
    oidc_issuer_url = "https://auth.panghuer.top"
    redirect_url = "https://obsidian.panghuer.top/oauth2/callback"
    upstreams = ["http://127.0.0.1:3001/"]
    pass_host_header = true
    set_xauthrequest = true
    request_logging = false
    authenticated_emails_file = "/owner/emails"
    scope = "openid email profile"
    cookie_name = "__Host-obsidian"
    cookie_path = "/"
    cookie_secure = true
    cookie_samesite = "lax"
    cookie_expire = "8h"
    cookie_refresh = "1h"
    cookie_csrf_per_request = true
    reverse_proxy = true
    proxy_websockets = true
    skip_provider_button = true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-owner
  namespace: obsidian
data:
  # Keep this file synchronized with the deployed allowlist.
  # One verified Casdoor email per line.
  emails: |
    zmh_haha@163.com
