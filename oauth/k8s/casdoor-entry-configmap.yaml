apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-entry-config
  namespace: oauth
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      # OAuth URLs may contain codes or tokens; do not log request URLs.
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 0;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
      }
      # Respect explicit organization parameters, including empty ones.
      map $args $registration_args {
        ~*(^|&)organization(=|&|$) $args;
        '' organization=Normal-User;
        default $args&organization=Normal-User;
      }
      map $request_method $dcr_args {
        default $args;
        POST $registration_args;
      }
      server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
        location = /api/oauth/register {
          proxy_pass http://127.0.0.1:8000/api/oauth/register?$dcr_args;
        }
        location / {
          proxy_pass http://127.0.0.1:8000;
        }
      }
    }
