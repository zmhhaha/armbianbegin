apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-oauth
  namespace: dsh
data:
  oauth2-proxy.cfg: |
    http_address = "0.0.0.0:4180"
    provider = "oidc"
    oidc_issuer_url = "https://auth.panghuer.top"
    redirect_url = "https://dsh.panghuer.top/oauth2/callback"
    upstreams = ["http://127.0.0.1:3081/"]
    pass_host_header = true
    set_xauthrequest = true
    request_logging = false
    authenticated_emails_file = "/owner/emails"
    scope = "openid email profile"
    cookie_name = "__Host-dsh"
    cookie_path = "/"
    cookie_secure = true
    cookie_samesite = "lax"
    cookie_expire = "8h"
    # cookie_refresh 刻意不设（2026-10-15 与 hermes / pi 统一）。
    #
    # 会话已改存 Redis，cookie 里只有一个会话 ID，所以"刷新需要 token 在会话里"
    # 这条 4KB 限制不再适用 —— 但仍然不刷新，因为【刷新循环的风险与会话存在哪里无关】：
    # refresh token 一旦被吊销，oauth2-proxy 会对每个请求重试刷新且永不放弃。
    # 当时实测 dsh-web 对 /api/login/oauth 每秒约 98 个 token 请求，耗尽 MySQL 连接，
    # 在无关服务的登录页上报 "Error 1040: Too many connections"。
    # 不能刷新的会话不能成环。
    #
    # 代价：会话满 cookie_expire（8h）后需要重新登录一次，而不是静默续期。
    # hermes-oauth 与 pi-oauth 出于同一理由也是这个设置。
    cookie_csrf_per_request = true
    reverse_proxy = true
    proxy_websockets = true
    skip_provider_button = true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-owner
  namespace: dsh
data:
  # Fill your verified Casdoor email. Empty deliberately grants nobody access.
  # Add/remove users on the server: kubectl -n dsh edit configmap dsh-owner
  # Edit data.emails: one verified email per line; retain existing users.
  # After deploying the dynamic-allowlist adapter, no restart is needed.
  # Allow time for Kubernetes to refresh the mounted ConfigMap file.
  # Existing WebSocket connections are not immediately revoked on removal.
  # Also update this file, otherwise the next deployment overwrites live edits.
  # Apply this file from the repository root:
  # kubectl apply -f oauth/k8s/dsh-proxy-configmap.yaml
  emails: |
    zmh_haha@163.com
