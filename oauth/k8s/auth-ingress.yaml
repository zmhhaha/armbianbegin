# 集群内的 auth.panghuer.top：由 ingress-nginx 终结 TLS，再转发到 Casdoor。
#
# 为什么需要它：
#   集群里的 oauth2-proxy 把 https://auth.panghuer.top 当作 OIDC issuer 访问。
#   没有这个 Ingress 时，该域名只能解析到公网（国内 VPS），于是每次内部鉴权都要
#   出集群 -> 公网 -> VPS -> frp 隧道 -> 回到家里，实测 3.3 s。
#   有了它，CoreDNS 可以把该域名指到 ingress-nginx 的 Service（集群内），
#   整条 OIDC 链路留在集群内，约 1–3 ms，并且不再依赖 VPS 与隧道。
#
# 证书由 cert-manager 通过 Cloudflare DNS-01 自动签发与续期（ClusterIssuer:
# cloudflare-dns01，见 cert-manager/）。issuer 与 Host 头都保持 auth.panghuer.top，
# 所以 OIDC 的 iss 校验、以及 Casdoor 自己生成的回调地址都不受影响。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-internal
  namespace: oauth
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-dns01
  labels:
    app.kubernetes.io/part-of: oauth
    purpose: cluster-internal-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.panghuer.top
      secretName: auth-panghuer-top-tls
  rules:
    - host: auth.panghuer.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casdoor
                port:
                  number: 8000
