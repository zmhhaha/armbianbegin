# ============================================================
#  oauth2-proxy ConfigMap 模板 —— **不要直接 apply**
#
#  它有两个占位符：__TARGET_NAME__ 和 __UPSTREAM__。只替换前者的写法
#  （sed "s/__TARGET_NAME__/.../g" | kubectl apply -f -）会渲染出
#  `uri: __UPSTREAM__`，实测会让 oauth2-proxy 在启动时 panic：
#      panic: runtime error: index out of range [0] with length 0
#      github.com/oauth2-proxy/oauth2-proxy/v7/pkg/validation.Validate
#  而改 ConfigMap 不触发滚动更新，所以在跑的 Pod 当时无异常，下次重启才 CrashLoop。
#
#  用 deploy-agent-proxy.sh 部署，它两个占位符都替换：
#    bash deploy-agent-proxy.sh research-agent [upstream]
#  默认 upstream = http://ui.<target>.svc.cluster.local:7860
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config-__TARGET_NAME__
  namespace: oauth
data:
  alpha-config.yaml: |
    # ---- OIDC 提供商: Casdoor ----
    providers:
      - id: oidc
        provider: oidc
        clientID: ${OIDC_CLIENT_ID}
        clientSecret: ${OIDC_CLIENT_SECRET}
        scope: "openid email profile"
        oidcConfig:
          issuerURL: ${OIDC_ISSUER_URL}
          userIDClaim: "sub"
          emailClaim: "email"
          groupsClaim: "groups"
          audienceClaims: ["aud"]

    # ---- 上游服务路由 ----
    upstreamConfig:
      upstreams:
        - id: __TARGET_NAME__-ui
          path: /
          uri: __UPSTREAM__
          passHostHeader: true
          proxyWebSockets: true

    # ---- 注入到后端请求的用户身份 Header ----
    injectRequestHeaders:
      - name: X-Forwarded-User
        values:
          - claim: user
      - name: X-Forwarded-Email
        values:
          - claim: email
      - name: X-Forwarded-Preferred-Username
        values:
          - claim: preferred_username

    # ---- 服务绑定地址 ----
    server:
      BindAddress: "0.0.0.0:4180"

    metricsServer:
      BindAddress: "0.0.0.0:44180"
