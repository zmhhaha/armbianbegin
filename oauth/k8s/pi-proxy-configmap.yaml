apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-oauth
  namespace: pi
data:
  oauth2-proxy.cfg: |
    http_address = "0.0.0.0:4180"
    provider = "oidc"
    oidc_issuer_url = "https://auth.panghuer.top"
    redirect_url = "https://pi.panghuer.top/oauth2/callback"
    # loopback on purpose: the sidecar shares this Pod's network namespace with
    # pi-cage, so `serve` keeps its default bind of 127.0.0.1 and no routable
    # listener exists anywhere in the Pod. See panghu_chat/pi/README.md.
    upstreams = ["http://127.0.0.1:7681/"]
    pass_host_header = true
    # Kept, but it is NOT what makes pi-cage work -- an earlier version of this
    # comment said it was, and that was wrong.
    #
    # oauth2-proxy's help is explicit about which switch does what:
    #
    #   --pass-user-headers  pass X-Forwarded-User and X-Forwarded-Email to
    #                        upstream                              (default true)
    #   --set-xauthrequest   set X-Auth-Request-User and X-Auth-Request-Email
    #                        *response* headers (useful in Nginx auth_request mode)
    #
    # X-Auth-Request-* answers a different question: it is set on the response for
    # a fronting nginx in auth_request mode to read, and it is not the header that
    # reaches the upstream. This deployment's slice of pi-cage therefore reads
    # X-Forwarded-Email -- see PI_CAGE_AUTH_HEADER in panghu_chat/pi/k8s/core.yaml.
    #
    # The flag is left on because it is harmless and useful if nginx is ever put in
    # front. Nothing here depends on it.
    set_xauthrequest = true
    request_logging = false
    authenticated_emails_file = "/owner/emails"
    scope = "openid email profile"
    cookie_name = "__Host-pi"
    cookie_path = "/"
    cookie_secure = true
    cookie_samesite = "lax"
    cookie_expire = "8h"
    # cookie_refresh is deliberately absent, and it is not an oversight.
    #
    # oauth2-proxy refuses to start with both of these set:
    #
    #   invalid configuration:
    #     cookie_refresh > 0 requires oauth tokens in sessions.
    #     session_cookie_minimal cannot be set
    #
    # Since the session has to shrink below the 4 KB cookie limit -- see
    # session_cookie_minimal below -- the refresh has to go. The cost is that a
    # session now lasts cookie_expire and then asks for a fresh login rather than
    # renewing silently.
    #
    # The gain is worth more than the cost: a refresh loop is exactly the failure
    # mode currently taking Casdoor down for every service on this cluster. An
    # oauth2-proxy holding a session whose refresh token has been revoked retries
    # that refresh on every request and never gives up; dsh-web was measured
    # issuing ~98 token requests per second against
    # /api/login/oauth, which exhausted MySQL connections and produced
    # "Error 1040: Too many connections" on a login page that had nothing to do
    # with dsh. A session that cannot refresh cannot loop.
    cookie_csrf_per_request = true
    reverse_proxy = true
    # ttyd is a websocket. Without this the page loads and the terminal never
    # connects.
    proxy_websockets = true
    skip_provider_button = true
    # session_cookie_minimal was here, and has been REMOVED. History, because the
    # reasoning that put it there is still worth keeping even though the line is
    # gone.
    #
    # Casdoor's id_token and access_token are large enough that the cookie session
    # exceeded the 4 KB per-cookie limit, and oauth2-proxy said so itself:
    #
    #   [session_store.go:170] WARNING: Multiple cookies are required for this
    #   session as it exceeds the 4kb cookie limit.
    #
    # That was a real failure and a misleading one: the session restored only
    # partially, oauth2-proxy still forwarded the request, `serve` answered
    # 407 Proxy Auth Required, and a browser reported ERR_UNEXPECTED_PROXY_AUTH --
    # an error naming a proxy problem for what was a session-size problem.
    #
    # session_cookie_minimal fixed the size. It is removed now because it is
    # documented as "(cookie session store only)" while this service now stores
    # sessions in Redis (DB6), making it dead configuration at best -- and because
    # the failure it was meant to prevent could equally be explained by it
    # trimming fields out of the session, which would leave the upstream with an
    # empty identity header. It is not worth keeping a setting whose effect under
    # the current store type is uncertain, when the store type already removes the
    # limit it existed for.
    #
    # cookie_refresh stays off, and for a reason unrelated to storage: see below.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-owner
  namespace: pi
data:
  # Fill your verified Casdoor email. Empty deliberately grants nobody access.
  # Add/remove users on the server: kubectl -n pi edit configmap pi-owner
  # Edit data.emails: one verified email per line; retain existing users.
  # Allow time for Kubernetes to refresh the mounted ConfigMap file.
  # Existing WebSocket connections are not immediately revoked on removal --
  # the terminal stays open until it reconnects, and pi-cage's session is a tmux
  # session that outlives the browser.
  # Also update this file, otherwise the next deployment overwrites live edits.
  # Apply this file from the repository root:
  # kubectl apply -f oauth/k8s/pi-proxy-configmap.yaml
  emails: |
    zmh_haha@163.com
