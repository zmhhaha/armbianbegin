<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Panghu Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
.shell{width:min(960px,100%);margin:0 auto;padding:0 20px;flex:1}
.header{text-align:center;padding:72px 20px 36px}
.mark{width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid rgba(45,212,191,.45);border-radius:24px;color:#99f6e4;background:linear-gradient(145deg,#134e4a,#164e63);font-size:3em;box-shadow:0 16px 40px rgba(20,184,166,.16)}
.header h1{font-size:clamp(2.1rem,5vw,3rem);letter-spacing:.01em;background:linear-gradient(135deg,#99f6e4,#67e8f9,#a5b4fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.header p{color:#94a3b8;font-size:1.05rem;line-height:1.7}
.section-title{display:flex;align-items:center;gap:10px;margin:16px 0 14px;color:#cbd5e1;font-size:1.05rem}
.section-title:before{content:"";width:4px;height:20px;border-radius:2px;background:#2dd4bf}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:0 0 52px}
.card{display:flex;align-items:flex-start;gap:18px;padding:26px;border:1px solid #334155;border-radius:14px;background:#1e293b;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);border-color:#2dd4bf;box-shadow:0 12px 34px rgba(45,212,191,.15)}
.card-icon{flex:0 0 auto;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;color:#99f6e4;background:rgba(45,212,191,.13);font-size:1.8rem}
.card-content{min-width:0}
.card h2{margin-bottom:7px;color:#f8fafc;font-size:1.25rem}
.card p{color:#94a3b8;line-height:1.65;font-size:.94rem}
.card-meta{display:inline-block;margin-top:13px;padding:4px 9px;border:1px solid rgba(45,212,191,.25);border-radius:5px;color:#5eead4;background:rgba(45,212,191,.08);font-size:.75rem}
.footer{padding:20px;color:#475569;text-align:center;font-size:.85rem}
@media (max-width:640px){.shell{padding:0 16px}.header{padding:54px 10px 28px}.card{padding:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div class="mark" aria-hidden="true">虎</div>
    <h1>Panghu Chat</h1>
    <p>朋友之间，认真写点东西。<br>写下想法，也看看朋友最近在想什么。</p>
  </header>

  <h2 class="section-title">Chat apps</h2>
  <div class="grid">
    <a href="https://hublog.panghuer.top/" class="card" target="_blank" rel="noopener noreferrer">
      <div class="card-icon" aria-hidden="true">虎</div>
      <div class="card-content">
        <h2>虎博 Hublog</h2>
        <p>朋友之间的微博系统。发布虎博、关注朋友、评论互动，并在通知中及时看到新的回应。</p>
        <span class="card-meta">打开 Hublog</span>
      </div>
    </a>
  </div>
</main>
<footer class="footer">Powered by ArmbianBegin &copy; 2026</footer>
</body>
</html>
