# 备案号展示（任务一）——只在这些主机上注入 ✓
#
# 口径：未登录无法进入任何服务 ✓，因此**登录页与门户页**展示备案号即可 ✓
#      （抽查时以"服务需登录、入口已展示"作说明 ✓）
#
# 新增门户时，在下面的 map 里加一行即可 ✓（不用改任何应用 ✓）
# 换备案号：替换两处 "津ICP备2026014922号-1" ✓，然后 sudo systemctl reload nginx ✓
#
# 实现要点：sub_filter 不能放在 if 里 ✗，所以用 map 决定"替换成什么" ✓：
#   命中白名单 → 注入角标 HTML；未命中 → 替换为空（等于不注入 ✓）
map $host $beian_footer_html {
    default            "";

    auth.panghuer.top  "<div id=\"icp-beian\" style=\"position:fixed;right:8px;bottom:6px;z-index:2147483647;font:12px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:6px;padding:2px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)\"><a href=\"https://beian.miit.gov.cn/\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:#6b7280;text-decoration:none\">津ICP备2026014922号-1</a></div>";
    chat.panghuer.top  "<div id=\"icp-beian\" style=\"position:fixed;right:8px;bottom:6px;z-index:2147483647;font:12px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:6px;padding:2px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)\"><a href=\"https://beian.miit.gov.cn/\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:#6b7280;text-decoration:none\">津ICP备2026014922号-1</a></div>";
    game.panghuer.top  "<div id=\"icp-beian\" style=\"position:fixed;right:8px;bottom:6px;z-index:2147483647;font:12px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:6px;padding:2px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)\"><a href=\"https://beian.miit.gov.cn/\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:#6b7280;text-decoration:none\">津ICP备2026014922号-1</a></div>";
    tool.panghuer.top  "<div id=\"icp-beian\" style=\"position:fixed;right:8px;bottom:6px;z-index:2147483647;font:12px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:6px;padding:2px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)\"><a href=\"https://beian.miit.gov.cn/\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:#6b7280;text-decoration:none\">津ICP备2026014922号-1</a></div>";
    agent.panghuer.top "<div id=\"icp-beian\" style=\"position:fixed;right:8px;bottom:6px;z-index:2147483647;font:12px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:6px;padding:2px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)\"><a href=\"https://beian.miit.gov.cn/\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:#6b7280;text-decoration:none\">津ICP备2026014922号-1</a></div>";
}

# 只对 HTML 生效 ✓；未命中白名单时替换为空串 = 原样输出 ✓
sub_filter_once off;
sub_filter_types text/html;
sub_filter '</body>' "$beian_footer_html</body>";