# 静态资源缓存（任务二 Step 4）——机会性加速：命中后完全不碰家里上行 ✓
#
# 安全边界（重要 ✓）：
#   · 只匹配 /assets/ /static/ /plugins/ /oauth2/static/ —— 构建产物 ✓
#   · **不**忽略 Set-Cookie ✗ → 带 Set-Cookie 的响应 nginx 默认不缓存 ✓
#     （实测 Casdoor 的资产就带 casdoor_session_id ✓ → 因此不会被缓存 ✓ 这是对的 ✓）
#   · 只缓存 200 ✓，其余状态与写入请求不缓存 ✓
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:20m
                 max_size=2g inactive=30d use_temp_path=off;