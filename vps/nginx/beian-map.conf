# 备案号展示（任务一）——全站注入 ✓，两个 map 都必须在 http 上下文 ✓（conf.d/ 即 http ✓）
#
# 策略：**默认给所有站点注入** ✓（新增服务自动生效 ✓，无需维护清单 ✓）
#      唯一例外：登录页 auth 交给 Casdoor 自己的 footerHtml ✓（避免两处重复 ✗）
#      例外名单在下面第二个 map 里写一行 "" 即可 ✓
#
# 换备案号：替换 <div id=\"icp-beian\" style=\"position:fixed;right:8px;bottom:6px;z-index:2147483647;font:12px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:6px;padding:2px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)\"><a href=\"https://beian.miit.gov.cn/\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:#6b7280;text-decoration:none\">津ICP备2026014922号-1</a></div> 里的号码（两处：本文件 + 无）✓，然后 sudo systemctl reload nginx ✓

# ① 只在「页面导航」（Accept 含 text/html）时去掉上游压缩，
#    否则 sub_filter 拿到的可能是压缩流 → 改不动 ✗
map $http_accept $beian_upstream_ae {
    default        $http_accept_encoding;
    "~*text/html"  "";
}

# ② 默认全站注入；下面列出的主机则**不**注入（替换为空串 ✓）
map $host $beian_footer_html {
    default            "<div id=\"icp-beian\" style=\"position:fixed;right:8px;bottom:6px;z-index:2147483647;font:12px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:6px;padding:2px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)\"><a href=\"https://beian.miit.gov.cn/\" target=\"_blank\" rel=\"noreferrer noopener\" style=\"color:#6b7280;text-decoration:none\">津ICP备2026014922号-1</a></div>";

    # 登录页由 Casdoor 应用自身的 footerHtml 渲染 ✓（你想改由 nginx 注入也行：
    # 删掉下面这行即可 ✓）
    auth.panghuer.top  "";
}