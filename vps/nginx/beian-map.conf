# 备案号展示（任务一）——两个 map 都必须放在 http 上下文 ✓（conf.d/ 就是 http ✓）
#
# 分工：
#   登录页  → 由 Casdoor 应用自己的 footer 字段负责 ✓（后台可改 ✓，无需 nginx ✓）
#   门户页  → 由下面的白名单注入 ✓（应用零改动 ✓）
#
# 新增门户：在第二个 map 里加一行 ✓；换备案号：替换各行号码 ✓

# ① 只在「页面导航」（Accept 含 text/html）时去掉上游压缩，
#    否则 sub_filter 拿到的可能是压缩流 → 改不动 ✗
map $http_accept $beian_upstream_ae {
    default        $http_accept_encoding;
    "~*text/html"  "";
}

# ② 白名单：命中 → 注入角标；未命中 → 空串（等于完全不注入 ✓）
