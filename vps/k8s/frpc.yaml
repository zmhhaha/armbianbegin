# frpc —— 国内 VPS 入口机（62.234.50.20）的隧道客户端
#
# ★ 它住在**自己的命名空间 `frpc`** 里 ✓ ——它是共享基础设施，不属于任何业务
#   命名空间（早先放在 dsh 里是错的 ✗：会占掉 dsh 的 Pod 配额，归属也混乱）。
#   这也与 Cloudflare 连接器（跑在 default）的做法一致：连接器独立、
#   各目标命名空间用一条 frpc-ingress **按需放行** ✓。
#
# 位置说明：本文件在外层仓库的 vps/ 下，与 vps/install.sh、frps.toml.template
# 同处一地（和 cloudflare-tunnel/ 集中放置隧道集群侧清单的惯例一致 ✓）。
# 它不由 dsh/deploy.sh 应用 → 集群重装后跑一次：bash install-frpc.sh ✓
#
# ★ 前提：先有 Secret frpc-config（含 frpc.toml 与隧道 token，token 不进 git ✗）
apiVersion: v1
kind: Namespace
metadata:
  name: frpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: frpc
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frpc
  namespace: frpc
spec:
  replicas: 1
  # ★ 保持 Recreate：换配置靠 restart，避免瞬间出现两个同名代理注册（会 already exists ✗）
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frpc
  template:
    metadata:
      labels:
        app: frpc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frpc
        image: arm-cluster-master:5000/frpc:v0.71.0
        imagePullPolicy: IfNotPresent
        args: ["-c", "/etc/frp/frpc.toml"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/frp
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: frpc-config
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frpc-egress
  namespace: frpc
spec:
  podSelector:
    matchLabels:
      app: frpc
  policyTypes: ["Egress"]
  egress:
  - to:
    - ipBlock:
        cidr: 62.234.50.20/32      # ← VPS 公网 IP；换机器时改这里
    ports:
    - port: 7000
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # 各命名空间里常见 Web 服务的端口（新增对外服务时按需加）
  - to:
    - namespaceSelector: {}
    ports:
    - { port: 80,   protocol: TCP }
    - { port: 3000, protocol: TCP }
    - { port: 4173, protocol: TCP }
    - { port: 4180, protocol: TCP }
    - { port: 7860, protocol: TCP }
    - { port: 8000, protocol: TCP }
    - { port: 8080, protocol: TCP }
    - { port: 8090, protocol: TCP }